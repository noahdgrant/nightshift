# nightshift's own factory definition. Spec: docs/FACTORY.md.
name = "nightshift"
gates = "auto"

[worktree]
setup = ["git config core.hooksPath .githooks"]   # .githooks runs scripts/ci-local.sh --fast on every commit and push

[gate]
local = "build-only"            # all of local CI once, after build; --fast plus affected tests elsewhere (ADR-466)

[defaults]
billing = "subscription"        # Max plan login only; API keys are stripped from child processes
harness = "claude"
model = "opus"
timeout_minutes = 45
max_attempts = 2

[phases.triage]
skill = "ns-triage"
model = "sonnet"
timeout_minutes = 20

[phases.build]
skill = "ns-build"
timeout_minutes = 90

[phases.verify]
skill = "ns-verify"
model = "sonnet"

[phases.review]
skill = "ns-review"
timeout_minutes = 150            # up to 5 cycles (3 full, 2 fix-only); 90 cut off 4 reviews on 2026-10-11/12 (#348)
model = "sonnet"                # Opus cost ~90% of the first unit; revisit once evals compare models

[phases.ship]
skill = "ns-ship"
model = "sonnet"
timeout_minutes = 60               # the push runs the fast checks, then ship waits on GitHub CI; 30 cut off #367 and #419

[queue]
source = "github"
ready_label = "status:ready-for-agent"
in_progress_label = "status:in-progress"
done_label = "status:in-review"
stuck_label = "status:ready-for-human"
priority = ["priority:critical", "priority:high", "priority:medium", "priority:low"]
order = ["type:fix", "type:feat", "type:refactor", "type:test", "type:ci", "type:docs", "type:chore"]


[merge]
policy = "auto"                 # ns run merges its own PRs when review passes, CI is green, and no file that needs human review changed
human_review = [
  ".github/**",                 # CI and the PR title check
  "scripts/check-private.sh",   # private-reference guard
  ".nightshift/**",             # this definition, including this list
  ".githooks/**",               # the hooks that run local CI before commit and push
]
ci_timeout_minutes = 30
