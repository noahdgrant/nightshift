[package]
name = "nightshift"
version = "0.4.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "ns"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde_json = "1"
sha2 = "0.11"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
