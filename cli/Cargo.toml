[package]
name = "sf"
version = "0.1.0"
edition = "2021"
description = "Software Factory CLI: worktrees, headless harness calls, skill lint and install"
license = "MIT"

[[bin]]
name = "sf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
