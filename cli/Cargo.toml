[package]
name = "nightshift"
version = "0.1.0"
edition = "2021"
description = "Nightshift CLI: worktrees, headless harness calls, skill lint and install"
license = "MIT"

[[bin]]
name = "ns"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
