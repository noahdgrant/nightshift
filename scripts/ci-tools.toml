# The tools CI installs and scripts/ci-local.sh checks, each pinned to one version. Pin a
# tool here and nowhere else; scripts/ci-tools.sh is the only reader.
#
#   version  the pin
#   install  how CI installs it: pip (package, default the tool's name), apt (package; its bin,
#            default /usr/bin/<package>, linked onto PATH as the tool's name), install-action
#            (taiki-e/install-action) or download (the zip at url, checked against sha256, with
#            its bin, a path inside the zip, linked onto PATH); {version} in url and bin is the pin
#   check    a command whose output names the installed version

[ruff]
version = "0.14.2"
install = "pip"
check = "ruff --version"

[ast-grep]
version = "0.50.0"
install = "pip"
package = "ast-grep-cli"
check = "ast-grep --version"

[cargo-deny]
version = "0.20.2"
install = "install-action"
check = "cargo-deny --version"

[clang-tidy]
version = "18"
install = "apt"
package = "clang-tidy-18"
check = "clang-tidy --version"

[pytest]
version = "9.1.1"
install = "pip"
check = "pytest --version"
