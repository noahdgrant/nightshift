# The tools CI installs and scripts/ci-local.sh checks, each pinned to one version. Pin a
# tool here and nowhere else; scripts/ci-tools.sh is the only reader.
#
#   version  the pin
#   install  how CI installs it: pip (package, default the tool's name), apt (package,
#            linked into /usr/local/bin as the tool's name) or install-action
#            (taiki-e/install-action)
#   check    a command whose output names the installed version

[ruff]
version = "0.14.2"
install = "pip"
check = "ruff --version"

[ast-grep]
version = "0.50.0"
install = "pip"
package = "ast-grep-cli"
check = "ast-grep --version"

[cargo-deny]
version = "0.20.2"
install = "install-action"
check = "cargo-deny --version"

[clang-tidy]
version = "18"
install = "apt"
package = "clang-tidy-18"
check = "clang-tidy --version"

[pytest]
version = "9.1.1"
install = "pip"
check = "pytest --version"

# The JavaScript/TypeScript rule pack (rules/js/): its tools come from its own lockfile, run
# under this Node and installed with this npm.
[node]
version = "18"
install = "apt"
package = "nodejs"
check = "node --version"

[npm]
version = "9.2.0"
install = "apt"
check = "npm --version"
