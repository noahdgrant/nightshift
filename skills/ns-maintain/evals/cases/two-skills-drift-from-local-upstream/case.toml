description = "Three adapted skills under skills/ record acme/skills at its first commit. setup.sh builds that upstream as a local repo inside .git with a second commit, and redirects https://github.com/ to it with git's insteadOf, so no network is used. Upstream greet gains a by-name greeting and a Tone section (both fit). Upstream farewell gains a step posting to Slack, which the adapted ns-farewell rules out (no chat integration). Upstream stable is unchanged. The repo has no git remote, so no PR can open. ns-maintain should make one branch per drifted skill, touching only that skill: ns-greet with the change ported, ns-farewell with the Slack step skipped and the reason recorded, both with the recorded sha moved to upstream HEAD, and no branch for ns-stable."
fixture = "py-inventory"
skills = ["ns-maintain"]
extra_skills = ["ns-writing-for-humans"]
requires = ["python"]
timeout_minutes = 20
prompt = """
Sync the adapted skills in skills/ with their upstream. gates: auto. Nobody is around to answer questions.
"""

[setup]
commands = ["sh ../setup.sh"]

[[check]]
type = "command"
run = "command -v ns"
expect_exit = 0

[[check]]
type = "command"
run = '''
python3 - <<'PYEOF'
import re, subprocess, sys

def git(*args, cwd="."):
    return subprocess.run(["git", *args], cwd=cwd, capture_output=True, text=True, check=True).stdout

head = git("rev-parse", "--short=12", "HEAD", cwd=".git/fake-upstream/acme/skills").strip()
current = git("rev-parse", "--abbrev-ref", "HEAD").strip()
branches = [b for b in git("for-each-ref", "--format=%(refname:short)", "refs/heads").split() if b != current]
touching = {}
for branch in branches:
    files = git("diff", "--name-only", f"HEAD...{branch}").split()
    skills = {f.split("/")[1] for f in files if f.startswith("skills/")}
    if len(skills) > 1:
        sys.exit(f"branch {branch} touches several skills: {sorted(skills)}")
    for skill in skills:
        stray = [f for f in files if not f.startswith(f"skills/{skill}/") and not f.startswith(".ns/")]
        if stray:
            sys.exit(f"branch {branch} touches paths outside skills/{skill}/: {stray}")
        touching.setdefault(skill, []).append(branch)
print("branches by skill:", touching)
if "ns-stable" in touching:
    sys.exit("ns-stable did not drift, but a branch changes it")
for skill in ("ns-greet", "ns-farewell"):
    if len(touching.get(skill, [])) != 1:
        sys.exit(f"expected exactly one branch for {skill}, found {touching.get(skill, [])}")
    skill_md = git("show", f"{touching[skill][0]}:skills/{skill}/SKILL.md")
    if f"acme/skills@{head}:skills/" not in skill_md:
        sys.exit(f"{skill} on {touching[skill][0]} does not record upstream HEAD {head}")
greet_branch = touching["ns-greet"][0]
greet = git("show", f"{greet_branch}:skills/ns-greet/SKILL.md")
if not re.search(r"(?i)by name", greet):
    sys.exit("ns-greet does not greet by name: the applicable upstream change was not ported")
greet_log = git("log", "--format=%B", f"HEAD..{greet_branch}")
if not re.search(r"(?i)one sentence", greet) and not re.search(r"(?i)\btone\b", greet_log):
    sys.exit("ns-greet neither ports the Tone section nor records skipping it")
farewell_branch = touching["ns-farewell"][0]
farewell = git("show", f"{farewell_branch}:skills/ns-farewell/SKILL.md")
if re.search(r"(?i)slack_post|post\w*\s+(the\s+)?(summary\s+)?to\b.*slack", farewell):
    sys.exit("ns-farewell took the Slack step, which the adapted skill rules out")
log = git("log", "--format=%B", f"HEAD..{farewell_branch}")
if not re.search(r"(?i)slack", log):
    sys.exit("ns-farewell's commits do not record the skipped Slack step")
print("ok")
PYEOF
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".ns/**"]

[[check]]
type = "judge"
rubric = "Read the agent's transcript and the ns-greet and ns-farewell branches. Pass only if the agent used `ns upstream status` and `ns upstream diff` rather than fetching the upstream by hand, gave every upstream hunk a verdict (ported, already covered, or skipped with a one-sentence reason, the Slack step skipped because the repo has no chat integration), ran `ns eval --dry-run` and never a real `ns eval`, and reported that no PR could open because the repo has no remote, rather than claiming one opened."
required = false
