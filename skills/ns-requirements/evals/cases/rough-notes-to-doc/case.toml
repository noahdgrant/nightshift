description = "Rough meeting notes for a low-stock alert feature. Under gates: auto, with no one to interview, the skill should write a versioned requirements doc plus changelog where docs/agents/docs.md says, with MoSCoW sections, <KEY>-<n> IDs, person-actor stories, undecided values left as [?] with Open questions rows, and Status short of Approved. ns-grilling and ns-setup are not loaded: nobody can answer, and the overlay supplies docs/agents/docs.md."
fixture = "py-inventory"
skills = ["ns-requirements"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Turn the rough notes in notes/low-stock-alerts.md into a requirements doc. No one is around to answer questions. gates: auto
"""

[[check]]
type = "command"
run = '[ "$(ls docs/requirements/*/v1.md 2>/dev/null | wc -l)" -eq 1 ]'
expect_exit = 0

[[check]]
type = "command"
run = 'f=$(ls docs/requirements/*/v1.md) && [ -f "$(dirname "$f")/changelog.md" ]'
expect_exit = 0

[[check]]
type = "command"
run = '''
f=$(ls docs/requirements/*/v1.md) && for c in Must Should Could "Won.{1,3}t"; do grep -Eiq "^#+ *$c" "$f" || exit 1; done
'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && grep -Eq '^\| *[A-Z][A-Z0-9]*-[0-9]+ *\|' "$f" && ! grep -Eq 'PARK-[0-9]+' "$f"'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && grep -Eiq 'As an? [^,]*(manager)' "$f" && grep -Eiq 'As an? [^,]*(purchas|buyer|procure|order)' "$f"'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && ! grep -Eiq 'As (an?|the) (system|service|server|cli|api|script|job|cron) *,' "$f" && ! grep -Eq 'S1\. As a driver' "$f"'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && [ "$(grep -Fo '[?]' "$f" | wc -l)" -ge 2 ] && r=$(awk 'tolower($0) ~ /^#+ *open questions/{o=1;next} /^#+ /{o=0} o && /^\| *[^| -]/ && tolower($0) !~ /^\| *question/' "$f") && [ -n "$r" ] && [ -z "$(printf '%s\n' "$r" | awk -F'|' '$3 !~ /[^ \t-]/')" ] && printf '%s\n' "$r" | awk -F'|' '{print $3}' | grep -Eq 'Priya|Tom''''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && awk '/^#+ *Won.{1,3}t/{w=1;next} /^#+ /{w=0} w' "$f" | grep -Eiq 're-?order\w*' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && ! awk 'tolower($0) ~ /^#+ *(sources|open questions|won.{1,3}t)/{x=1;next} /^#+ /{x=0} !x' "$f" | grep -v '\[?\]' | grep -Eq '(^|[^0-9A-Za-z.-])10([^0-9A-Za-z-]|$)' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && s=$(grep -Ei '^\| *\**Status' "$f" | tr -d '*') && ! printf '%s' "$s" | grep -Eiq 'Approved' && printf '%s' "$s" | grep -Eiq '\| *(Draft|In review) *\|' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/requirements/*/v1.md) && ! grep -Eq '^>' "$f"'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = ["docs/requirements/**", "docs/agents/docs.md", ".ns/**"]

[[check]]
type = "judge"
rubric = "Read the requirements doc under docs/requirements/. Pass only if: the threshold ('maybe 10?') and the alert delivery channel are left as [?] with Open questions rows naming an owner (Priya or Tom) rather than invented; available stock (net of reservations) is the measured quantity; auto-reordering is a Won't with a reason; days-of-stock is a Could; not slowing reserve/fulfil is a requirement with a [?] or sourced bar rather than an adjective; and no row names a mechanism (email, cron) as the requirement."
required = false
