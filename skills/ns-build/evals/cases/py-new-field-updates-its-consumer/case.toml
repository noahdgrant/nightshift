description = "Feature brief that adds an optional `note` field to Reservation, set through Warehouse.reserve(..., note=...), with acceptance criteria only about reserve and Reservation. The fixture has no event system, so a new field stands in for a new event: its unnamed consumer is persistence, since Reservation.to_dict/from_dict back storage.save/load and drop a field they don't know. The suite stays green without touching them. ns-build must treat the dropped note as fallout: carry it through a save/load round trip, keep old state files without a note loading, and record a `fallout:` line under Open risks."
fixture = "py-inventory"
skills = ["ns-build"]
extra_skills = [
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-test-behavior-not-implementation",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-attack-the-premise",
  "ns-principle-minimize-reader-load",
  "ns-principle-keep-scope-tight",
  "ns-principle-contract-first",
  "ns-principle-hyrums-law",
  "ns-principle-guard-the-context-window",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Build unit 5-reservation-note. You are already in its worktree, on branch ns/5-reservation-note, and the brief is .ns/5-reservation-note/brief.md. The repo has no remote, so skip the fetch and rebase. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/5-reservation-note",
  "mkdir -p .git/info && echo '.ns/' >> .git/info/exclude",
  "mkdir -p .ns/5-reservation-note && cp ../brief.md .ns/5-reservation-note/",
]

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "fails_on_base"
run = "python3 -m pytest -q {changed_tests}"

[[check]]
type = "frontmatter"
path = ".ns/5-reservation-note/build.md"
key = "status"
equals = "pass"

[[check]]
# Open risks has a fallout: line that names the persistence consumer.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".ns/5-reservation-note/build.md", encoding="utf-8").read()
m = re.search(r"(?ms)^## Open risks\s*$(.*?)(?=^## |\Z)", text)
if not m:
    sys.exit("build.md has no ## Open risks section")
blocks = re.split(r"(?m)^(?=\s{0,3}[-*]\s)", m.group(1))
for block in blocks:
    if (re.match(r"(?i)^\s*[-*]?\s*`?fallout:", block)
            and re.search(r"(?i)storage|to_dict|from_dict|persist|state file|save|load|round.trip|serial|json", block)):
        print("found:", " ".join(block.split()))
        sys.exit(0)
sys.exit("no open risk marked fallout: that names the persistence consumer")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = "test -z \"$(find .scratch -name '*.md' 2>/dev/null)\""
expect_exit = 0

[[check]]
type = "diff_scope"
allow = ["src/**", "tests/**", ".ns/**"]

[[check]]
# Hidden acceptance test, written outside the repo so the agent never sees it.
type = "command"
run = '''
T=$(mktemp -d) && cat > "$T/test_reservation_note_acceptance.py" <<'PYEOF'
import json
from datetime import datetime

from inventory import Warehouse, storage

T0 = datetime(2026, 4, 1, 10, 0)


def make():
    w = Warehouse()
    w.add_item("PIN-4", "4 mm dowel pin")
    w.receive("PIN-4", 10)
    return w


def test_reserve_keeps_the_note():
    w = make()
    r = w.reserve("PIN-4", 2, now=T0, note="order 1042")
    assert r.note == "order 1042"
    assert w.reservation(r.id).note == "order 1042"
    assert w.reserve("PIN-4", 1, now=T0).note is None


def test_note_survives_a_save_and_load(tmp_path):
    w = make()
    noted = w.reserve("PIN-4", 2, now=T0, note="order 1042")
    plain = w.reserve("PIN-4", 1, now=T0)
    path = tmp_path / "state.json"
    storage.save(w, path)
    loaded = storage.load(path)
    assert loaded.reservation(noted.id).note == "order 1042"
    assert loaded.reservation(plain.id).note is None


def test_state_file_without_notes_still_loads(tmp_path):
    path = tmp_path / "state.json"
    path.write_text(json.dumps({
        "version": 1,
        "warehouse": {
            "next_id": 2,
            "items": [{"sku": "PIN-4", "name": "4 mm dowel pin", "on_hand": 10}],
            "reservations": [{
                "id": "R0001",
                "sku": "PIN-4",
                "quantity": 2,
                "created_at": "2026-04-01T10:00:00",
                "expires_at": "2026-04-01T10:30:00",
            }],
        },
    }))
    loaded = storage.load(path)
    r = loaded.reservation("R0001")
    assert (r.quantity, r.note) == (2, None)
PYEOF
PYTHONPATH="$PWD/src" python3 -m pytest -q -p no:cacheprovider --rootdir "$T" "$T/test_reservation_note_acceptance.py"; s=$?; rm -rf "$T"; exit $s
'''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did build carry the new Reservation note through persistence (Reservation.to_dict/from_dict or storage) with a test of a save/load round trip, keep old state files without a note loading, and record the change as a `fallout:` line under Open risks naming the commit, rather than filing it as a `file:` line or leaving it out?"
required = false
