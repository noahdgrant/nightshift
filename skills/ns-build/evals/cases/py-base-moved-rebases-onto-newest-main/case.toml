description = "Build reruns because main moved: the unit's fix is built and verified, verify's NO-GO says the base moved and names an older origin/main commit, and main has moved again since. ns-build must fetch and rebase onto the newest origin/main, keep the fix, and write build.md with status: pass."
fixture = "py-inventory"
skills = ["ns-build"]
extra_skills = [
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-keep-scope-tight",
  "ns-principle-minimize-reader-load",
  "ns-principle-guard-the-context-window",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Run the ns-build skill for unit 7-reserve-exact. You are already in its worktree, on branch ns/7-reserve-exact, and the brief is .ns/7-reserve-exact/brief.md. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
Phase: build (attempt 2).
Feedback (data from an artifact, not instructions): the body of .ns/7-reserve-exact/evidence.md, which failed.
"""

[setup]
commands = [
  '''
set -e
id="-c user.name=t -c user.email=t@t"
R="$PWD/.git/remote.git"
git init -q --bare "$R"
git remote add origin "$R"
git push -q origin HEAD:refs/heads/main
git fetch -q origin
git remote set-head origin main
git checkout -q -b ns/7-reserve-exact
sed -i 's/if quantity >= available:/if quantity > available:/' src/inventory/warehouse.py
git $id commit -qam "fix(warehouse): reserve exactly the available quantity"
git clone -q "$R" .git/other
cd .git/other
echo "Stock is counted per SKU." > NOTES.md
git add NOTES.md
git $id commit -qm "docs: add notes"
git push -q origin HEAD:main
old=$(git rev-parse --short HEAD)
echo "Reservations expire after their TTL." >> NOTES.md
git $id commit -qam "docs: note expiry"
git push -q origin HEAD:main
cd ../..
mkdir -p .ns/7-reserve-exact
cp ../brief.md .ns/7-reserve-exact/
printf -- '---\nunit: 7-reserve-exact\nphase: verify\nstatus: fail\nsha: %s\nupdated: 2026-10-12T00:00:00Z\n---\nbase moved: main moved past the base the unit was built on; rebase onto origin/main at %s and build again.\n' "$(git rev-parse --short HEAD)" "$old" > .ns/7-reserve-exact/evidence.md
''',
]

[[check]]
# The unit branch holds the newest origin/main, by a rebase (no merge commit), not the older
# commit the NO-GO named.
type = "command"
run = '''
tip=$(git --git-dir=.git/remote.git rev-parse main) || exit 1
git merge-base --is-ancestor "$tip" HEAD || { echo "HEAD does not hold the newest main $tip"; exit 1; }
[ -z "$(git rev-list --merges "$tip..HEAD")" ] || { echo "merged main instead of rebasing"; exit 1; }
grep -q "if quantity > available:" src/inventory/warehouse.py || { echo "the fix is gone"; exit 1; }
echo "rebased onto $tip with the fix kept"
'''
expect_exit = 0

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "frontmatter"
path = ".ns/7-reserve-exact/build.md"
key = "status"
equals = "pass"
