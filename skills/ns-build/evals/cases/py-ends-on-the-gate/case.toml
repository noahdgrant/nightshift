description = "Bug-fix brief in a repo whose stack.md names a ci-local command (all of CI). ns-build must run targeted tests while it builds, then end on that ci-local command, once, at its final commit on a clean tree, and never run the full test suite on its own."
fixture = "py-inventory"
skills = ["ns-build"]
extra_skills = [
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-test-behavior-not-implementation",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-attack-the-premise",
  "ns-principle-minimize-reader-load",
  "ns-principle-keep-scope-tight",
  "ns-principle-contract-first",
  "ns-principle-hyrums-law",
  "ns-principle-guard-the-context-window",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Build unit 9-reserve-exact. You are already in its worktree, on branch ns/9-reserve-exact, and the brief is .ns/9-reserve-exact/brief.md. The repo has no remote, so skip the fetch and rebase. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/9-reserve-exact",
  "mkdir -p .git/info && echo '.ns/' >> .git/info/exclude",
  "mkdir -p .ns/9-reserve-exact && cp ../brief.md .ns/9-reserve-exact/",
]

[[check]]
type = "command"
run = '''
log="$(git rev-parse --git-common-dir)/ns-eval-ci-local.log"
[ -s "$log" ] || { echo "ci-local never ran"; exit 1; }
last=$(tail -n 1 "$log"); head=$(git rev-parse HEAD)
[ "$last" = "$head clean" ] || { echo "last ci-local run was '$last', HEAD is $head"; exit 1; }
[ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "uncommitted changes"; git status --short; exit 1; }
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
log="$(git rev-parse --git-common-dir)/ns-eval-full-runs.log"
[ -f "$log" ] || { echo "no full run logged"; exit 1; }
n=$(grep -c '^direct$' "$log"); [ "$n" -eq 0 ] || { echo "$n full test runs outside ci-local"; exit 1; }
'''
expect_exit = 0

[[check]]
type = "fails_on_base"
run = "python3 -m pytest -q {changed_tests}"

[[check]]
type = "frontmatter"
path = ".ns/9-reserve-exact/build.md"
key = "status"
equals = "pass"

[[check]]
type = "regex"
path = ".ns/9-reserve-exact/build.md"
pattern = "(?m)^## Checks\\n(?:.*\\n)*?.*ci-local"

[[check]]
type = "diff_scope"
allow = ["src/**", "tests/**", ".ns/**"]

[[check]]
type = "judge"
rubric = "Did build run targeted tests (one test or one file) while it built, then run the ci-local command from stack.md once as its final full check, after its last commit, and record that run under Checks in build.md, without running the full test suite or lint on their own?"
required = false
