description = "Build a four-criterion brief in a repo whose stack.md sets a hard unit size of 30 changed lines. ns-build must check the diff after each commit, and once it passes the hard limit with criteria still unmet, stop with build.md status: blocked, \"unit too large\" as the first body line, and the criteria met and left listed for triage to split."
fixture = "py-inventory"
skills = ["ns-build"]
extra_skills = [
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-test-behavior-not-implementation",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-attack-the-premise",
  "ns-principle-minimize-reader-load",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Build unit 5-renew-and-release. You are already in its worktree, on branch ns/5-renew-and-release, and the brief is .ns/5-renew-and-release/brief.md. The repo has no remote, so skip the fetch and rebase. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
"""

[setup]
# The limit is committed on main so it doesn't count toward the unit's own diff.
commands = [
  "printf '\\n## Unit size\\n\\nunit size: soft 15, hard 30\\n' >> docs/agents/stack.md",
  "git commit -q -am 'docs(agents): set a tiny unit size'",
  "git checkout -q -b ns/5-renew-and-release",
  "mkdir -p .git/info && echo '.ns/' >> .git/info/exclude",
  "mkdir -p .ns/5-renew-and-release && cp ../brief.md .ns/5-renew-and-release/",
]

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "frontmatter"
path = ".ns/5-renew-and-release/build.md"
key = "status"
equals = "blocked"

[[check]]
# The first non-blank body line after the frontmatter starts with "unit too large".
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".ns/5-renew-and-release/build.md", encoding="utf-8").read()
m = re.match(r"(?s)---\n.*?\n---\n(.*)", text)
if not m:
    sys.exit("build.md has no frontmatter")
first = next((l for l in m.group(1).splitlines() if l.strip()), "")
if not re.match(r"(?i)[\s#>*_`]*unit too large", first):
    sys.exit(f"first body line does not start with 'unit too large': {first!r}")
print("found:", first)
PYEOF
'''
expect_exit = 0

[[check]]
# Build stopped after a commit, not before writing any code.
type = "command"
run = "test \"$(git log --format=%s main..HEAD | grep -cvx setup)\" -ge 1"
expect_exit = 0

[[check]]
# It stopped because the diff passed the hard limit, not on an estimate.
type = "command"
run = "git diff --numstat main...HEAD -- . ':!.ns' | awk '{ n += $1 + $2 } END { print n \" changed lines\"; exit !(n > 30) }'"
expect_exit = 0

[[check]]
type = "diff_scope"
allow = ["src/**", "tests/**", ".ns/**"]

[[check]]
type = "judge"
rubric = "Does build.md open its body with \"unit too large\", then list which acceptance criteria the commits meet and which are left, clearly enough for ns-triage to split the remaining criteria into a new unit? Did build stop after the commit that passed the hard limit instead of building every criterion?"
required = false
