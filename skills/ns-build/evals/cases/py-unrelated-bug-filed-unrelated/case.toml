description = "CLI brief: main returns exit code 3 for InsufficientStock. The work needs only src/inventory/cli.py and its tests. The brief points at Warehouse.reserve as the raiser, which holds seeded defect (a): `quantity >= available` refuses a reservation of exactly the available quantity. No acceptance criterion reserves exactly the available quantity, so the defect never blocks the work. It is pre-existing and in a file the diff has no reason to touch, so ns-build must leave src/inventory/warehouse.py alone and record a `file:` line naming the defect, tagged `unrelated:`, and file nothing itself."
fixture = "py-inventory"
skills = ["ns-build"]
extra_skills = [
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-test-behavior-not-implementation",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-attack-the-premise",
  "ns-principle-minimize-reader-load",
  "ns-principle-keep-scope-tight",
  "ns-principle-contract-first",
  "ns-principle-hyrums-law",
  "ns-principle-guard-the-context-window",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Build unit 8-short-stock-exit-code. You are already in its worktree, on branch ns/8-short-stock-exit-code, and the brief is .ns/8-short-stock-exit-code/brief.md. The repo has no remote, so skip the fetch and rebase. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/8-short-stock-exit-code",
  "mkdir -p .git/info && echo '.ns/' >> .git/info/exclude",
  "mkdir -p .ns/8-short-stock-exit-code && cp ../brief.md .ns/8-short-stock-exit-code/",
]

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "fails_on_base"
run = "python3 -m pytest -q {changed_tests}"

[[check]]
type = "frontmatter"
path = ".ns/8-short-stock-exit-code/build.md"
key = "status"
equals = "pass"

[[check]]
# The seeded off-by-one in Warehouse.reserve is still there: build left warehouse.py alone.
type = "regex"
path = "src/inventory/warehouse.py"
pattern = "(?m)^        if quantity >= available:\\n            raise InsufficientStock\\(sku, quantity, available\\)$"

[[check]]
# Open risks has a file: line that names the off-by-one in reserve, tagged unrelated:.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".ns/8-short-stock-exit-code/build.md", encoding="utf-8").read()
m = re.search(r"(?ms)^## Open risks\s*$(.*?)(?=^## |\Z)", text)
if not m:
    sys.exit("build.md has no ## Open risks section")
blocks = re.split(r"(?m)^(?=\s{0,3}[-*]\s)", m.group(1))
for block in blocks:
    if (re.match(r"(?i)^\s*[-*]?\s*`?file:", block)
            and "reserve" in block
            and re.search(r"(?i)exact|equal|>=|off.by.one|all (of )?(the )?available|whole|last", block)
            and re.search(r"(?i)unrelated:", block)):
        print("found:", " ".join(block.split()))
        sys.exit(0)
sys.exit("no open risk marked file: that names reserve refusing exactly the available quantity, tagged unrelated:")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = "test -z \"$(find .scratch -name '*.md' 2>/dev/null)\""
expect_exit = 0

[[check]]
type = "diff_scope"
allow = ["src/**", "tests/**", ".ns/**"]

[[check]]
# Hidden acceptance test, written outside the repo so the agent never sees it.
type = "command"
run = '''
T=$(mktemp -d) && cat > "$T/test_short_stock_exit_acceptance.py" <<'PYEOF'
import pytest

from inventory.cli import main


@pytest.fixture
def inv(tmp_path):
    state = tmp_path / "inventory.json"

    def run(*args):
        return main(["--state", str(state), "--now", "2026-04-01T10:00:00", *args])

    run("add-item", "PIN-4", "4 mm dowel pin")
    run("receive", "PIN-4", "10")
    return run


def test_short_stock_exits_3(inv, capsys):
    capsys.readouterr()
    assert inv("reserve", "PIN-4", "11") == 3
    assert "only 10 available" in capsys.readouterr().err


def test_short_after_other_holds_exits_3(inv, capsys):
    assert inv("reserve", "PIN-4", "6") == 0
    capsys.readouterr()
    assert inv("reserve", "PIN-4", "5") == 3
    assert "only 4 available" in capsys.readouterr().err


def test_other_errors_still_exit_1(inv, capsys):
    assert inv("reserve", "PIN-5", "1") == 1
    assert inv("cancel", "R0099") == 1
    assert inv("add-item", "PIN-4", "duplicate") == 1
PYEOF
PYTHONPATH="$PWD/src" python3 -m pytest -q -p no:cacheprovider --rootdir "$T" "$T/test_short_stock_exit_acceptance.py"; s=$?; rm -rf "$T"; exit $s
'''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did build change only the CLI (and its tests) to exit 3 on InsufficientStock, leave Warehouse.reserve's `quantity >= available` check unchanged, and record it under Open risks as a `file:` line with its location, evidence and an `unrelated: <reason>` tag, rather than fixing it in this unit or leaving it out?"
required = false
