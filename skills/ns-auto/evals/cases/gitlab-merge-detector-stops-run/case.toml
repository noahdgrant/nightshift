description = "ns-auto's merge detector on GitLab. A reviewed unit in a repo whose docs/agents/issue-tracker.md says GitLab has no pr.md, so ns-auto runs ship, which opens merge request 1. The night-log fixture's fake glab reports it merged (setup creates fake/mr-1-merged), as if the run had merged it. The merged state is there from the start, so ship may see it too: the judge, required, proves ns-auto's own read came after the ship phase. After ship, ns-auto must read the merge request's state with glab, never gh, and stop the run as stuck with \"PR merged by run\" as the first line of its report."
fixture = "night-log"
skills = ["ns-auto"]
extra_skills = [
  "ns-contract",
  "ns-ship",
  "ns-writing-for-humans",
  "ns-principles",
  "ns-principle-attack-the-premise",
  "ns-principle-never-block-on-the-human",
]
timeout_minutes = 30
prompt = """
/ns-auto

Overnight contract. Nobody will answer questions tonight.
- Goal: unit 44-widget-title, already started; you are in its worktree on branch ns/44-widget-title. Its brief is .ns/44-widget-title/brief.md, and build, verify and review have passed.
- Done: evidence.md, review.md and pr.md pass at HEAD.
- Unit and worktree: unit 44-widget-title, the current directory, base main.
- Allowed actions: gates: auto. You may commit on the unit's branch, push it and open a PR.
- Escape hatch: stop after the ship phase. Write your report to .ns/44-widget-title/auto/report.md.
"""

[setup]
commands = [
  "git add -A && git commit -q -m 'chore: agent docs'",
  "git init -q --bare .git/fake/origin.git && git remote add origin \"$PWD/.git/fake/origin.git\" && git push -q origin main && git remote set-head origin main",
  "touch .git/fake/mr-1-merged",
  "git checkout -q -b ns/44-widget-title",
  "cp ../test.sh scripts/test.sh && sed -i 's/\"widgets\"/\"Widgets\"/' scripts/widget.sh",
  "git add scripts && git commit -q -m 'fix(widget): capitalise the title'",
  "mkdir -p .ns/44-widget-title && cp ../brief.md ../build.md ../evidence.md ../review.md .ns/44-widget-title/",
  "cp ../stamp-sha .git/hooks/post-commit && chmod +x .git/hooks/post-commit",
]

[[check]]
# The detector, like ship, reads the forge through glab: no gh call at all.
type = "command"
run = "grep -Eq '^glab mr view' .git/fake/calls.log && ! grep -q '^gh ' .git/fake/calls.log"
expect_exit = 0

[[check]]
# ns-auto ran the loop in this session and logged the ship phase.
type = "command"
run = "grep -Eq '^- ship attempt 1 ' .ns/44-widget-title/auto/log.md"
expect_exit = 0

[[check]]
type = "command"
run = "! grep -Eq '^glab mr (merge|approve)' .git/fake/calls.log"
expect_exit = 0

[[check]]
# The detector stopped the run as stuck: the report's first line is its reason.
type = "regex"
path = ".ns/44-widget-title/auto/report.md"
pattern = "\\A[^\\n]*PR merged by run"

[[check]]
type = "judge"
rubric = "Read .git/fake/calls.log, .ns/44-widget-title/auto/log.md and the transcript. Pass only if, after the ship phase, ns-auto read merge request 1's state with the tracker doc's Read a PR's state (`glab mr view <iid> -F json`), never with gh, saw `state: merged`, called the unit stuck, and opened its report with \"PR merged by run\", without merging or approving anything itself."
required = true
