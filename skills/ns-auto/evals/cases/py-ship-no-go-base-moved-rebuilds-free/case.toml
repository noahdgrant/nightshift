description = "A unit whose ship wrote a NO-GO saying the base moved, after build already used both of its attempts in this invocation (one failed, one passed). Per the Pick the phase table the NO-GO sends the unit to build, and that build is free once per new origin/main sha, so ns-auto runs build instead of calling the unit stuck, with build rebased onto the newest origin/main."
fixture = "py-inventory"
skills = ["ns-auto"]
extra_skills = [
  "ns-contract",
  "ns-triage",
  "ns-build",
  "ns-tdd",
  "ns-verify",
  "ns-review",
  "ns-ship",
  "ns-swarm",
  "ns-no-comments",
  "ns-setup",
  "ns-setup-verify",
  "ns-writing-for-humans",
  "ns-principles",
  "ns-principle-attack-the-premise",
  "ns-principle-encode-lessons-in-structure",
  "ns-principle-explain-the-number",
  "ns-principle-fix-root-causes",
  "ns-principle-laziness-protocol",
  "ns-principle-minimize-reader-load",
  "ns-principle-keep-scope-tight",
  "ns-principle-contract-first",
  "ns-principle-hyrums-law",
  "ns-principle-guard-the-context-window",
  "ns-principle-never-block-on-the-human",
  "ns-principle-prove-it-works",
  "ns-principle-redesign-from-first-principles",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-test-behavior-not-implementation",
]
requires = ["python"]
timeout_minutes = 40
prompt = """
/ns-auto

Overnight contract. Nobody will answer questions tonight.
- Goal: unit 7-reserve-exact, already started; you are in its worktree on branch ns/7-reserve-exact. Its brief is .ns/7-reserve-exact/brief.md and its run log .ns/7-reserve-exact/auto/log.md.
- Done: evidence.md, review.md and pr.md pass at HEAD.
- Unit and worktree: unit 7-reserve-exact, the current directory, base main.
- Allowed actions: gates: auto. You may commit on the unit's branch. Do not push or open a PR.
- Escape hatch: stop after the build phase that follows the NO-GO and report here.
"""

[setup]
commands = [
  '''
set -e
id="-c user.name=t -c user.email=t@t"
R="$PWD/.git/remote.git"
git init -q --bare "$R"
git remote add origin "$R"
git push -q origin HEAD:refs/heads/main
git fetch -q origin
git remote set-head origin main
git checkout -q -b ns/7-reserve-exact
sed -i 's/if quantity >= available:/if quantity > available:/' src/inventory/warehouse.py
git $id commit -qam "fix(warehouse): reserve exactly the available quantity"
git clone -q "$R" .git/other
cd .git/other
echo "Stock is counted per SKU." > NOTES.md
git add NOTES.md
git $id commit -qm "docs: add notes"
git push -q origin HEAD:main
cd ../..
sha=$(git rev-parse --short HEAD)
u=.ns/7-reserve-exact
mkdir -p $u/auto
cp ../brief.md $u/
art() { printf -- '---\nunit: 7-reserve-exact\nphase: %s\nstatus: %s\nsha: %s\nupdated: 2026-10-12T00:00:00Z\n---\n%s\n' "$1" "$2" "$sha" "$3" > $u/$4.md; }
art build pass "Fixed the comparison." build
art verify pass "Reserving 5 of 5 works." evidence
art review pass "No findings." review
art ship fail "base moved: main moved past the base the unit was built on; rebase onto origin/main and build again." pr
printf '## run 2026-10-12T00:00:00Z\n- build attempt 1 fail %s: tests red\n- build attempt 2 pass %s: Fixed the comparison.\n- verify attempt 1 pass %s: ok\n- review attempt 1 pass %s: ok\n- ship attempt 1 fail %s: base moved\n' "$sha" "$sha" "$sha" "$sha" "$sha" > $u/auto/log.md
''',
]

[[check]]
# The rebuild ran: the NO-GO is archived, build.md was rewritten and passes, and the run log
# has a third build line, so ns-auto did not call the unit stuck on build's two attempts.
type = "command"
run = '''
ls .ns/7-reserve-exact/history/pr-*.md >/dev/null 2>&1 || { echo "pr.md was not archived"; exit 1; }
[ "$(grep -c '^- build attempt' .ns/7-reserve-exact/auto/log.md)" -ge 3 ] || { echo "no third build line"; cat .ns/7-reserve-exact/auto/log.md; exit 1; }
'''
expect_exit = 0

[[check]]
type = "frontmatter"
path = ".ns/7-reserve-exact/build.md"
key = "status"
equals = "pass"

[[check]]
# The branch holds the newest origin/main by a rebase (no merge commit), with the fix kept.
type = "command"
run = '''
git fetch -q origin
tip=$(git --git-dir=.git/remote.git rev-parse main) || exit 1
git merge-base --is-ancestor "$tip" HEAD || { echo "HEAD does not hold the newest main $tip"; exit 1; }
[ -z "$(git rev-list --merges "$tip..HEAD")" ] || { echo "merged main instead of rebasing"; exit 1; }
grep -q "if quantity > available:" src/inventory/warehouse.py || { echo "the fix is gone"; exit 1; }
'''
expect_exit = 0

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Read the transcript and .ns/7-reserve-exact/auto/log.md. Pass only if ns-auto read pr.md's first line, saw that it starts with 'base moved', routed the unit to build rather than stuck even though build had two lines in this invocation, fetched origin before building, told build the newest origin/main sha, and did not push, open a PR or merge."
required = false
