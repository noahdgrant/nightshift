description = "Feature: a read timeout on the sensor reader (zl_sensor_reader_sample_timeout). Testing it deterministically needs the fake HAL's clock: a timeout measured on the kernel clock, or a test that sleeps, can't pin when it fires. Plain-words feature request, test-first on native_sim."
fixture = "zephyr-logger"
# ns-tdd links to these skills by relative path (ns-contract for the quality bar, and the principles it and the bar name); ship them so the links resolve in the "with" arm.
skills = ["ns-tdd", "ns-principle-test-behavior-not-implementation", "ns-principle-sequence-verifiable-units", "ns-principle-fix-root-causes", "ns-contract"]
extra_skills = []
requires = ["zephyr"]
timeout_minutes = 30
prompt = """
Feature request from the field team: when the sensor has no reading ready, zl_sensor_reader_sample gives up at once with -EAGAIN, so the app spins calling it. Add a call that waits:

    int zl_sensor_reader_sample_timeout(struct zl_sensor_reader *reader, uint32_t timeout_ms);

It keeps polling the sensor until a reading is ready, then logs it exactly like zl_sensor_reader_sample does. If no reading is ready within timeout_ms it returns -ETIMEDOUT, and a timeout isn't counted as an error. Sensor and log errors are returned and counted as they are today. timeout_ms is in the same milliseconds the reader stamps its samples with. zl_sensor_reader_sample stays as it is and never waits.

Build it test-first. gates: auto. Nobody is around to answer questions, so take the seams from this request and carry on. Don't commit.
"""

[setup]
# Keep any .ns/ phase artifacts out of git so diff_scope only sees source and test changes.
commands = ["mkdir -p .git/info && echo '.ns/' >> .git/info/exclude"]

[[check]]
# The whole suite passes. Twister output goes to a temp dir (the wrapper uses mktemp).
type = "command"
run = "scripts/twister.sh"
expect_exit = 0

[[check]]
# scripts/twister.sh maps each changed test file to its suite. On base the new call doesn't exist,
# so any test of it fails to build; the checks below decide whether the test is any good.
type = "fails_on_base"
run = "scripts/twister.sh {changed_tests}"

[[check]]
type = "diff_scope"
allow = ["include/**", "drivers/**", "tests/**"]

[[check]]
# The seam: the reader's only clock is the HAL's uptime_ms, never the kernel's.
type = "command"
run = '''
! grep -rnE 'k_uptime_(get|delta|seconds)|k_cycle_get|sys_clock_|k_ticks_' drivers include
'''
expect_exit = 0

[[check]]
# A test added by the trial drives the timeout on fixed fake time: it names the new call and
# -ETIMEDOUT, and neither sleeps nor reads the kernel clock. regex checks take one fixed path,
# so grep the lines the trial added under tests/ (diff against the setup commit, the second in
# history, plus untracked files).
type = "command"
run = '''
B=$(git rev-list --reverse HEAD | sed -n 2p)
A=$( { git diff "$B" -U0 -- tests/ | grep '^+' ; git ls-files -o --exclude-standard tests/ | xargs -r cat ; } )
printf '%s\n' "$A" | grep -q 'zl_sensor_reader_sample_timeout' \
  && printf '%s\n' "$A" | grep -q 'ETIMEDOUT' \
  && ! printf '%s\n' "$A" | grep -Eq 'k_(sleep|msleep|usleep|busy_wait|yield)\(|k_uptime_|k_cycle_get|sys_clock_'
'''
expect_exit = 0

[[check]]
# Hidden acceptance suite, written outside the repo so the agent never sees it. It builds this
# checkout's module via ZEPHYR_EXTRA_MODULES and runs on native_sim. Its fake sensor spends 10 ms of
# fake time on every poll (1 ms in one test) and never touches the kernel clock, so a timeout
# measured on the HAL clock stops just past the deadline, one measured on the kernel clock stops
# early or late (or never, since native_sim time doesn't move in a busy loop), and a fixed poll
# count is wrong for one of the two step sizes. Uses ZL_RB_REJECT_NEW and never fills
# the log, so the fixture's drop-oldest defect can't fail it.
type = "command"
run = '''
set -e
T=$(mktemp -d)
S="$T/accept"
mkdir -p "$S/src"
cat > "$S/CMakeLists.txt" <<'EOF'
cmake_minimum_required(VERSION 3.20.0)
find_package(Zephyr REQUIRED HINTS $ENV{ZEPHYR_BASE})
project(sensor_timeout_accept)
target_sources(app PRIVATE src/main.c)
EOF
printf 'CONFIG_ZTEST=y\nCONFIG_ZL_SENSOR_READER=y\n' > "$S/prj.conf"
cat > "$S/testcase.yaml" <<'EOF'
tests:
  accept.sensor_timeout:
    timeout: 60
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
EOF
cat > "$S/src/main.c" <<'EOF'
#include <errno.h>
#include <zephyr/ztest.h>
#include <zl/ringbuf_log.h>
#include <zl/sensor_reader.h>

#define START_MS 1000U
#define NEVER UINT32_MAX

struct poll_fake {
	uint32_t now_ms;
	uint32_t step_ms;
	uint32_t ready_at_ms;
	int ready_error;
	int polls;
};

static int poll_ready(void *ctx)
{
	struct poll_fake *f = ctx;
	int ready = f->ready_error != 0 ? f->ready_error : f->now_ms >= f->ready_at_ms;

	f->polls++;
	f->now_ms += f->step_ms;
	return ready;
}

static int poll_read(void *ctx, uint16_t channel, int32_t *raw)
{
	ARG_UNUSED(ctx);
	ARG_UNUSED(channel);
	*raw = 420;
	return 0;
}

static uint32_t poll_uptime(void *ctx)
{
	return ((struct poll_fake *)ctx)->now_ms;
}

static const struct zl_sensor_hal hal = {
	.data_ready = poll_ready,
	.read_raw = poll_read,
	.uptime_ms = poll_uptime,
};

static const struct zl_sensor_reader_config cfg = {.channel = 5U, .scale_num = 1, .scale_den = 2};

static struct poll_fake fake;
static struct zl_sample storage[4];
static struct zl_ringbuf log;
static struct zl_sensor_reader reader;

static void before(void *f)
{
	ARG_UNUSED(f);
	fake = (struct poll_fake){.now_ms = START_MS, .step_ms = 10U, .ready_at_ms = NEVER};
	zassert_ok(zl_ringbuf_init(&log, storage, ARRAY_SIZE(storage), ZL_RB_REJECT_NEW));
	zassert_ok(zl_sensor_reader_init(&reader, &hal, &fake, &log, &cfg));
}

ZTEST_SUITE(accept, NULL, NULL, before, NULL, NULL);

ZTEST(accept, test_ready_at_once_logs_one_sample)
{
	struct zl_sample out;

	fake.ready_at_ms = START_MS;
	zassert_ok(zl_sensor_reader_sample_timeout(&reader, 50U));
	zassert_equal(zl_ringbuf_count(&log), 1);
	zassert_ok(zl_ringbuf_get(&log, &out));
	zassert_equal(out.channel, 5U);
	zassert_equal(out.value, 210);
	zassert_equal(zl_sensor_reader_errors(&reader), 0);
}

ZTEST(accept, test_waits_for_a_reading_inside_the_timeout)
{
	struct zl_sample out;

	fake.ready_at_ms = START_MS + 30U;
	zassert_ok(zl_sensor_reader_sample_timeout(&reader, 50U));
	zassert_equal(zl_ringbuf_count(&log), 1);
	zassert_ok(zl_ringbuf_get(&log, &out));
	zassert_true(out.timestamp_ms >= START_MS + 30U && out.timestamp_ms <= START_MS + 50U,
		     "timestamp %u", out.timestamp_ms);
	zassert_equal(out.value, 210);
	zassert_equal(zl_sensor_reader_errors(&reader), 0);
}

ZTEST(accept, test_times_out_on_the_sample_clock)
{
	zassert_equal(zl_sensor_reader_sample_timeout(&reader, 50U), -ETIMEDOUT);
	zassert_true(fake.now_ms >= START_MS + 50U && fake.now_ms <= START_MS + 70U,
		     "stopped at %u ms after %d polls", fake.now_ms, fake.polls);
	zassert_equal(zl_ringbuf_count(&log), 0);
	zassert_equal(zl_sensor_reader_errors(&reader), 0);
}

ZTEST(accept, test_timeout_does_not_assume_a_poll_interval)
{
	fake.step_ms = 1U;
	zassert_equal(zl_sensor_reader_sample_timeout(&reader, 50U), -ETIMEDOUT);
	zassert_true(fake.now_ms >= START_MS + 50U && fake.now_ms <= START_MS + 52U,
		     "stopped at %u ms after %d polls", fake.now_ms, fake.polls);
}

ZTEST(accept, test_reading_after_the_timeout_is_not_taken)
{
	fake.ready_at_ms = START_MS + 100U;
	zassert_equal(zl_sensor_reader_sample_timeout(&reader, 50U), -ETIMEDOUT);
	zassert_equal(zl_ringbuf_count(&log), 0);
}

ZTEST(accept, test_sensor_error_while_waiting_is_returned_and_counted)
{
	fake.ready_error = -EIO;
	zassert_equal(zl_sensor_reader_sample_timeout(&reader, 50U), -EIO);
	zassert_equal(zl_ringbuf_count(&log), 0);
	zassert_equal(zl_sensor_reader_errors(&reader), 1);
}

ZTEST(accept, test_sample_still_does_not_wait)
{
	zassert_equal(zl_sensor_reader_sample(&reader), -EAGAIN);
	zassert_equal(fake.polls, 1);
	zassert_equal(zl_sensor_reader_errors(&reader), 0);
}
EOF
"$ZEPHYR_BASE/scripts/twister" -T "$S" -p native_sim -x=ZEPHYR_EXTRA_MODULES="$PWD" -O "$T/out" --inline-logs
'''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the change add zl_sensor_reader_sample_timeout so that it measures the timeout on the HAL's uptime_ms (the clock the reader stamps samples with) and reuses the existing sample path, rather than reading the kernel clock, sleeping a fixed count, or changing zl_sensor_reader_sample to wait? Does the new test drive the timeout through a fake HAL whose clock the test controls, with literal times and no sleeps, and assert both a reading inside the timeout and -ETIMEDOUT without one?"
required = false
