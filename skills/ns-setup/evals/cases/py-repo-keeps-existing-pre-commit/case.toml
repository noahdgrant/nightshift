# Checks validated by hand: the fixture plus a stack.md whose Hooks section names .pre-commit-config.yaml passes every check; an added scripts/ci-local.sh or .githooks/, a set core.hooksPath, and a stack.md that never mentions the config each fail one.
description = "Set up a Python repo that already has a .pre-commit-config.yaml: setup records the existing hook in stack.md and adds no hook files, no ci-local script and no core.hooksPath."
fixture = "py-inventory"
skills = ["ns-setup"]
extra_skills = []
requires = ["python"]
timeout_minutes = 20
prompt = """
Set this repo up for the nightshift skills. gates: auto. Nobody is around to answer questions, so take the recommended answer for each one and carry on. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
# files/ adds a CI workflow and a .pre-commit-config.yaml running ruff.
commands = ["rm -r docs/agents"]

[[check]]
type = "command"
run = '''test ! -e scripts/ci-local.sh && test ! -e .githooks && test -z "$(git config core.hooksPath)"'''
expect_exit = 0

[[check]]
type = "command"
run = '''git diff --quiet HEAD -- .pre-commit-config.yaml'''
expect_exit = 0

[[check]]
type = "regex"
path = "docs/agents/stack.md"
pattern = "pre-commit-config\\.yaml"
present = true
