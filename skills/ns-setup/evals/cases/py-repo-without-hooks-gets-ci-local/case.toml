# Checks validated by hand: a ci-local.sh running ruff check, ruff format --check and pytest in that order, an executable .githooks/pre-commit that execs it with --fast, core.hooksPath set, and a ci-local row passes every check; a hook calling the script without --fast, a bash script, a script with pytest before ruff, and a [worktree] setup line written to .nightshift/nightshift.toml each fail one.
description = "Set up a Python repo with a CI workflow and no pre-commit hook: setup writes scripts/ci-local.sh mirroring CI in order, a .githooks/pre-commit that runs it with --fast, points core.hooksPath at it, names the script as stack.md's ci-local command, and leaves the .nightshift/ worktree line to whoever merges."
fixture = "py-inventory"
skills = ["ns-setup"]
extra_skills = []
requires = ["python"]
timeout_minutes = 20
prompt = """
Set this repo up for the nightshift skills. gates: auto. Nobody is around to answer questions, so take the recommended answer for each one and carry on. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
# files/ adds a CI workflow that runs ruff check, ruff format --check and pytest, in that order.
commands = ["rm -r docs/agents"]

[[check]]
type = "command"
run = '''test -x scripts/ci-local.sh && test "$(head -n 1 scripts/ci-local.sh)" = "#!/bin/sh" && sh -n scripts/ci-local.sh'''
expect_exit = 0

[[check]]
type = "regex"
path = "scripts/ci-local.sh"
pattern = "(?s)ruff check.*ruff format --check.*pytest"
present = true

[[check]]
type = "command"
run = '''test -x .githooks/pre-commit && grep -Eq 'scripts/ci-local\.sh +--fast' .githooks/pre-commit'''
expect_exit = 0

[[check]]
type = "command"
run = '''test "$(git config core.hooksPath)" = .githooks'''
expect_exit = 0

[[check]]
type = "regex"
path = "docs/agents/stack.md"
pattern = "\\| *ci-local *\\| *`[^`]*scripts/ci-local\\.sh"
present = true

[[check]]
# The [worktree] setup line is left for whoever merges, not written.
type = "command"
run = '''! grep -qs hooksPath .nightshift/nightshift.toml'''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the setup derive scripts/ci-local.sh from the repo's CI workflow (not a generic template), keep --fast to the quick steps, and give the `git config core.hooksPath .githooks` [worktree] setup line for .nightshift/nightshift.toml in its final message for whoever merges, rather than writing it?"
required = false
