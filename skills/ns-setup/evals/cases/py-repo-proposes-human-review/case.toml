# Checks validated by hand on a tree with .github/workflows/ci.yml and scripts/ci-local.sh: human_review = [".github/**", "scripts/ci-local.sh", ".nightshift/**"] with no policy passes every check; a list without .github/**, one without .nightshift/**, one naming a path the repo lacks (".gitlab-ci.yml"), a file that sets policy, and no [merge] table each fail one.
description = "Set up a Python repo with a GitHub CI workflow under gates: stop, the owner having said yes: setup writes a [merge] human_review starter list to .nightshift/nightshift.toml that covers the CI config and .nightshift/**, names only paths the repo has, and leaves merge.policy unset."
fixture = "py-inventory"
skills = ["ns-setup"]
extra_skills = []
requires = ["python"]
timeout_minutes = 20
prompt = """
Set this repo up for the nightshift skills. gates: stop. I'm not around to answer, and I already say yes to every recommended answer and every draft you would show me, so write them without asking. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
# files/ adds a CI workflow under .github/workflows/.
commands = ["rm -r docs/agents"]

[[check]]
# human_review holds .github/** and .nightshift/**, and policy stays unset.
type = "command"
run = '''python3 -c 'import sys, tomllib; m = tomllib.load(open(".nightshift/nightshift.toml", "rb"))["merge"]; l = m["human_review"]; sys.exit(0 if ".github/**" in l and ".nightshift/**" in l and "policy" not in m else 1)' '''
expect_exit = 0

[[check]]
# Every entry but .nightshift/** names a path the repo has.
type = "command"
run = '''python3 -c 'import glob, sys, tomllib; l = tomllib.load(open(".nightshift/nightshift.toml", "rb"))["merge"]["human_review"]; sys.exit(0 if all(p == ".nightshift/**" or glob.glob(p, recursive=True, include_hidden=True) for p in l) else 1)' '''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the setup show or name the human_review list as a proposal built from the repo's own CI, hook and script paths, rather than a fixed template?"
required = false
