description = "Set up a Python repo tested with pytest: the stack section offers the coverage ratchet from the Python pack, and recording its value is left to the user."
fixture = "py-inventory"
skills = ["ns-setup"]
extra_skills = []
requires = ["python"]
timeout_minutes = 20
prompt = """
Set this repo up for the nightshift skills. gates: auto. Nobody is around to answer questions, so take the recommended answer for each one and carry on. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
commands = ["mkdir -p .git/info && echo '.ns/' >> .git/info/exclude"]

[[check]]
type = "command"
run = "test ! -e .nightshift/ratchets.json"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the setup offer the Python coverage ratchet because the repo's tests run under pytest, and either add a `[ratchets.coverage]` table with `better = \"higher\"` to .nightshift/nightshift.toml or say in its final message that the pack's ratchet files could not be found? Recording the value must be left to the user: it gives `ns ratchet update` rather than writing .nightshift/ratchets.json."
required = false
