description = "Set up a repo with no Python, Rust or C stack: no rule pack ships a ratchet for it, so no ratchet is offered and nightshift.toml gets no [ratchets.*] table."
fixture = "night-log"
skills = ["ns-setup"]
extra_skills = []
requires = []
timeout_minutes = 20
prompt = """
Set this repo up for the nightshift skills. gates: auto. Nobody is around to answer questions, so take the recommended answer for each one and carry on. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
commands = ["mkdir -p .git/info && echo '.ns/' >> .git/info/exclude"]

[[check]]
type = "file_exists"
path = "docs/agents/stack.md"

[[check]]
type = "command"
run = "! grep -qs '^\\[ratchets\\.' .nightshift/nightshift.toml && test ! -e .nightshift/ratchets.json"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the setup leave ratchets out, without offering a coverage, binary size, flash or RAM ratchet, since the repo has no Python, Rust or C stack?"
required = false
