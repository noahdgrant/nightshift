# Checks validated by hand with a stub `west` (no Zephyr tree here): a per-worktree `git config --worktree zlogger.module "$NS_WORKTREE"` setup command with a stack.md build row of `scripts/build.sh` passes every check; a trivial setup command (`true`) with a plain `west build ... app` row, no setup command, and a setup command that reruns scripts/bootstrap.sh (it repoints the main checkout at the worktree), each fail.
description = "Set up a Zephyr repo whose build script reads the module path from shared git config, so a fresh worktree builds the main checkout's sources. Setup must find the trap, add [worktree] setup commands, and give stack.md a build command that builds the worktree's own app while the main checkout still builds its own. Its twister test command, which runs a worker per core by default, takes its worker count from NS_CPUS."
fixture = "zephyr-logger"
skills = ["ns-setup"]
extra_skills = []
requires = ["zephyr"]
timeout_minutes = 30
prompt = """
Set this repo up for the nightshift skills. gates: auto. Nobody is around to answer questions, so take the recommended answer for each one and carry on. This scratch copy has no nightshift checkout next to it, so if a rule pack's files cannot be copied, say so in your final message instead of inventing them. Don't commit.
"""

[setup]
# files/ adds scripts/bootstrap.sh, scripts/build.sh and a CI workflow that runs them.
# bootstrap.sh records this checkout in .git/config, which every linked worktree shares.
commands = [
  "rm -r docs/agents",
  "printf '\\n## Building\\n\\nRun `scripts/bootstrap.sh` once per clone, then build the app with `scripts/build.sh`.\\n' >> AGENTS.md",
  "scripts/bootstrap.sh",
]

[[check]]
type = "command"
run = '''python3 -c 'import sys, tomllib; sys.exit(0 if tomllib.load(open(".nightshift/nightshift.toml", "rb"))["worktree"]["setup"] else 1)' '''
expect_exit = 0

[[check]]
# Snapshot the trial's tree into a fresh worktree, run the [worktree] setup commands there the
# way `ns worktree new` does, then build with scripts/build.sh (the script CI uses, which reads the
# module path from shared git config) and with stack.md's build command, in the worktree and then in
# the main checkout. Each build must name its own checkout's app, so the setup commands have to
# defeat the trap and stack.md's build row has to be a command that builds the right app.
type = "command"
run = '''
set -eu
main=$(pwd -P)
cmd=$(sed -n 's/^| *build[^|]*| *`\([^`]*\)`.*/\1/p' docs/agents/stack.md | head -n 1)
[ -n "$cmd" ] || { echo "no build command in docs/agents/stack.md"; exit 1; }
echo "build command: $cmd"
tmp=$(cd -P "$(mktemp -d)" && pwd -P)
wt=$tmp/wt
trap 'git worktree remove --force "$wt" 2>/dev/null; rm -rf "$tmp"' EXIT
cp .git/index "$tmp/index"
GIT_INDEX_FILE=$tmp/index git add -A
tree=$(GIT_INDEX_FILE=$tmp/index git write-tree)
snap=$(git -c user.name=check -c user.email=check@localhost commit-tree "$tree" -p HEAD -m snapshot)
git worktree add -q --detach "$wt" "$snap"
python3 - "$wt" <<'PY'
import os, subprocess, sys, tomllib
setup = []
if os.path.exists(".nightshift/nightshift.toml"):
    with open(".nightshift/nightshift.toml", "rb") as f:
        setup = tomllib.load(f).get("worktree", {}).get("setup", [])
env = dict(os.environ, NS_UNIT="check", NS_WORKTREE=sys.argv[1], NS_MAIN_ROOT=os.getcwd())
for c in setup:
    subprocess.run(["sh", "-c", c], cwd=sys.argv[1], env=env, check=True)
PY
(cd "$wt" && scripts/build.sh "$tmp/trap-build") > "$tmp/script-wt.log" 2>&1 || { tail -n 20 "$tmp/script-wt.log"; exit 1; }
grep -Fx -- "-- Application: $wt/app" "$tmp/script-wt.log" || { echo "scripts/build.sh in the worktree did not build $wt/app"; grep -- '-- Application:' "$tmp/script-wt.log"; exit 1; }
scripts/build.sh "$tmp/trap-build-main" > "$tmp/script-main.log" 2>&1 || { tail -n 20 "$tmp/script-main.log"; exit 1; }
grep -Fx -- "-- Application: $main/app" "$tmp/script-main.log" || { echo "scripts/build.sh in the main checkout no longer builds $main/app"; grep -- '-- Application:' "$tmp/script-main.log"; exit 1; }
(cd "$wt" && sh -c "$cmd") > "$tmp/wt.log" 2>&1 || { tail -n 20 "$tmp/wt.log"; exit 1; }
grep -Fx -- "-- Application: $wt/app" "$tmp/wt.log" || { echo "the worktree build did not build $wt/app"; grep -- '-- Application:' "$tmp/wt.log"; exit 1; }
sh -c "$cmd" > "$tmp/main.log" 2>&1 || { tail -n 20 "$tmp/main.log"; exit 1; }
grep -Fx -- "-- Application: $main/app" "$tmp/main.log" || { echo "the main checkout no longer builds $main/app"; grep -- '-- Application:' "$tmp/main.log"; exit 1; }
'''
expect_exit = 0

[[check]]
type = "command"
run = '''grep -rqF NS_CPUS docs/agents/stack.md scripts/'''
expect_exit = 0
