# Does the ns-no-comments description fire on the right prompts? 7 positive, 7 negative.

[[trigger]]
prompt = "Strip the comments out of this diff."
expect = true

[[trigger]]
prompt = "Review flagged a pile of # type: ignore and eslint-disable lines in my change. Clean them up properly."
expect = true

[[trigger]]
prompt = "Before I ship, get rid of the noise comments in this branch."
expect = true

[[trigger]]
prompt = "Go through this diff as the Comment Sicko and kill every comment that doesn't earn its place."
