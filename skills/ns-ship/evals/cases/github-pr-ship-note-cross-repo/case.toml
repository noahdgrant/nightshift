description = "A reviewed unit whose brief carries a Ship note naming a cross-repo follow-up, `acme/other#12`. ns-ship cannot look that reference up with the tracker's view command, so it must record `Ship note: ... not checked (<why>)`, not treat it as not-found, write pr.md with status: pass and `Closes #44` plus the reference in the body, and open the PR without merging."
fixture = "night-log"
skills = ["ns-ship"]
extra_skills = ["ns-contract", "ns-writing-for-humans"]
timeout_minutes = 20
prompt = """
Ship unit 44-widget-title. It is checked out on branch ns/44-widget-title in this repo, and verify and review have passed. gates: auto. Nobody is around to answer questions.
"""

[setup]
commands = [
  "git add -A && git commit -q -m 'chore: agent docs'",
  "git init -q --bare .git/fake/origin.git",
  "git remote add origin \"$PWD/.git/fake/origin.git\" && git push -q origin main && git remote set-head origin main",
  "printf 'pr view --json url,isDraft\\t{\"url\":\"https://github.com/acme/widgets/pull/1\",\"isDraft\":false}\\n' > .git/fake/gh-answers",
  "git checkout -q -b ns/44-widget-title",
  "cp ../test.sh scripts/test.sh && sed -i 's/\"widgets\"/\"Widgets\"/' scripts/widget.sh",
  "git add scripts && git commit -q -m 'fix(widget): capitalise the title'",
  "mkdir -p .ns/44-widget-title && cp ../brief.md ../build.md ../evidence.md ../review.md .ns/44-widget-title/",
  "cp ../stamp-sha .git/hooks/post-commit && chmod +x .git/hooks/post-commit",
]

[[check]]
# The body after the frontmatter closes the unit's issue.
type = "command"
run = "awk 'f; /^---$/ && ++n==2 {f=1}' .ns/44-widget-title/pr.md | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #44\\b'"
expect_exit = 0

[[check]]
# The Ship note's item: the body names the cross-repo reference.
type = "command"
run = "awk 'f; /^---$/ && ++n==2 {f=1}' .ns/44-widget-title/pr.md | grep -Fq 'acme/other#12'"
expect_exit = 0

[[check]]
# The Verification section records the cross-repo reference as not checked, not as in the body or NO-GO.
type = "command"
run = "awk 'f; /^---$/ && ++n==2 {f=1}' .ns/44-widget-title/pr.md | grep -Eq '^[-*] .*Ship note: .*not checked'"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eq '^gh pr create ' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "! grep -Eq '^gh pr (merge|review)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "frontmatter"
path = ".ns/44-widget-title/pr.md"
key = "status"
equals = "pass"

[[check]]
type = "judge"
rubric = "Read .ns/44-widget-title/brief.md, .ns/44-widget-title/pr.md and the transcript. Pass only if the agent left the cross-repo reference `acme/other#12` unchecked (recorded as not checked, not NO-GO), the body sent closes #44 and names acme/other#12, and the agent did not merge or approve."
required = false
