description = "A reviewed unit whose build.md has a file: line on scripts/admin.sh:3, the same defect review.md already filed as escape #50 (deferred: #50). ns-ship must check the unit's own issues before filing, so it comments the risk on #50 instead of creating a second issue, rewrites the line to filed: #50, and stops at merge-ready without merging. The night-log fixture's fake gh records every call."
fixture = "night-log"
skills = ["ns-ship"]
extra_skills = ["ns-contract", "ns-writing-for-humans"]
timeout_minutes = 20
prompt = """
Ship unit 44-widget-title. It is checked out on branch ns/44-widget-title in this repo, and verify and review have passed. gates: auto. Nobody is around to answer questions.
"""

[setup]
commands = [
  "git add -A && git commit -q -m 'chore: agent docs'",
  "git init -q --bare .git/fake/origin.git",
  "git remote add origin \"$PWD/.git/fake/origin.git\" && git push -q origin main && git remote set-head origin main",
  "issue='{\"number\":50,\"state\":\"OPEN\",\"title\":\"admin.sh removes the wrong directory on an empty or spaced argument\",\"body\":\"scripts/admin.sh:3 runs rm -rf $dir/cache with $dir unquoted and unchecked, so sh scripts/admin.sh with no argument removes /cache. Found while reviewing 44-widget-title, outside its scope.\",\"labels\":[{\"name\":\"bug\"},{\"name\":\"needs-triage\"}]}'; printf 'pr view --json url,isDraft\\t{\"url\":\"https://github.com/acme/widgets/pull/1\",\"isDraft\":false}\\n' > .git/fake/gh-answers; for a in 'issue view 50' 'issue view 50 --json number,state,title,body' 'issue view 50 --json title,body,state' 'issue view 50 --json number,title,state,body' 'issue view 50 --json title,body' 'issue view 50 --json state,title,body'; do printf '%s\\t%s\\n' \"$a\" \"$issue\" >> .git/fake/gh-answers; done",
  "git checkout -q -b ns/44-widget-title",
  "cp ../test.sh scripts/test.sh && sed -i 's/\"widgets\"/\"Widgets\"/' scripts/widget.sh",
  "git add scripts && git commit -q -m 'fix(widget): capitalise the title'",
  "mkdir -p .ns/44-widget-title && cp ../brief.md ../build.md ../evidence.md ../review.md .ns/44-widget-title/",
  "cp ../stamp-sha .git/hooks/post-commit && chmod +x .git/hooks/post-commit",
]

[[check]]
# The risk went onto the escape issue the unit already filed.
type = "command"
run = "grep -Eq '^gh issue comment 50( |$)' .git/fake/calls.log"
expect_exit = 0

[[check]]
# No second issue for the same location.
type = "command"
run = "! grep -Eq '^gh issue create( |$)' .git/fake/calls.log"
expect_exit = 0

[[check]]
# The file: line was rewritten to point at #50.
type = "command"
run = "grep -Eq '^[-*] filed: #50\\b' .ns/44-widget-title/build.md && ! grep -Eq '^[-*] (file|unfiled):' .ns/44-widget-title/build.md"
expect_exit = 0

[[check]]
# The body closes the unit's issue.
type = "command"
run = "awk 'f; /^---$/ && ++n==2 {f=1}' .ns/44-widget-title/pr.md | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #44\\b'"
expect_exit = 0

[[check]]
# Follow-ups name #50.
type = "command"
run = "awk 'f; /^---$/ && ++n==2 {f=1}' .ns/44-widget-title/pr.md | grep -Eq '#50\\b'"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eq '^gh pr create ' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "! grep -Eq '^gh pr (merge|review)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "frontmatter"
path = ".ns/44-widget-title/pr.md"
key = "status"
equals = "pass"

[[check]]
type = "frontmatter"
path = ".ns/44-widget-title/pr.md"
key = "schema"
equals = "ns-artifact/2"

[[check]]
type = "judge"
rubric = "Read .ns/44-widget-title/build.md, .ns/44-widget-title/review.md, .ns/44-widget-title/pr.md and the transcript. Pass only if the agent saw that the build.md file: line names the same location as escape #50 in review.md, commented the risk on #50 (the comment opening with the disclosure line) instead of creating an issue, rewrote the line to filed: #50, and did not merge or approve."
required = false
