description = "Verify a committed build of `inventory status --json` that meets all three acceptance criteria, with an earlier run's files already in .ns/6-status-json/evidence/. ns-verify must write evidence.md with status: pass and leave the earlier files where they are: it never deletes files in evidence/."
fixture = "py-inventory"
skills = ["ns-verify"]
extra_skills = [
  "ns-contract",
  "ns-principle-prove-it-works",
  "ns-principle-explain-the-number",
  "ns-principle-test-behavior-not-implementation",
]
requires = ["python"]
timeout_minutes = 20
prompt = """
Verify unit 6-status-json. You are already in its worktree, on branch ns/6-status-json, and its brief and build artifacts are in .ns/6-status-json/. gates: auto. Nobody is around to answer questions. Stop after writing evidence.md: don't review or ship.
"""

[setup]
# As py-status-json-all-criteria-met, plus files an earlier run left in evidence/.
commands = [
  "cp ../verify.md docs/agents/verify.md",
  "python3 -c \"p='AGENTS.md'; s=open(p).read(); o='**Verify**: not set up yet.'; assert o in s, 'AGENTS.md has no Verify line to update'; open(p,'w').write(s.replace(o, '**Verify**: drive the CLI directly.'))\"",
  "git add -A && git commit -q -m 'docs(agents): verify by driving the CLI'",
  "git checkout -q -b ns/6-status-json",
  "git apply ../build.patch",
  "git add -A && git commit -q -m 'feat(cli): print stock levels as JSON with status --json'",
  "mkdir -p .ns/6-status-json/evidence && cp ../brief.md .ns/6-status-json/",
  "sed \"s/@SHA@/$(git rev-parse --short HEAD)/\" ../build.md > .ns/6-status-json/build.md",
  "printf 'status --json: earlier run\\n' > .ns/6-status-json/evidence/ac1-status.txt",
  "printf 'status --json SKU-1: earlier run\\n' > .ns/6-status-json/evidence/ac2-sku.txt",
]

[[check]]
type = "frontmatter"
path = ".ns/6-status-json/evidence.md"
key = "status"
equals = "pass"

[[check]]
# The earlier run's files are still there, unchanged.
type = "command"
run = '''
grep -qx 'status --json: earlier run' .ns/6-status-json/evidence/ac1-status.txt &&
grep -qx 'status --json SKU-1: earlier run' .ns/6-status-json/evidence/ac2-sku.txt
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".ns/**"]

[[check]]
type = "judge"
rubric = "Did verify leave the files already in .ns/6-status-json/evidence/ alone, with no `rm`, move or overwrite of them, writing its own artifacts under new names, and did it drive the real CLI for each criterion? Fail it if the transcript shows any attempt to delete or clear files in evidence/."
required = false
