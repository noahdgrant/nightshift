description = "Near miss for new-skill-needs-define: the same new-skill request, but it links a closed design issue where a team member recorded the agreed design (triggers, read-only authority, counts file as data). Under gates: auto, triage should mark it ready-for-agent, append an Agent Brief that carries the agreed design as settled by the team member, and start one unit (#346)."
fixture = "py-inventory"
skills = ["ns-triage"]
# Same skill set as design-chosen-ready-for-agent: ns-build is not installed, so the auto hand-off stops at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md"
pattern = '(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(needs-triage|needs-define|needs-info|ready-for-human|wontfix|closed)'
present = false

[[check]]
type = "regex"
path = ".scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md"
pattern = '(?m)^#+\s*Agent Brief'
present = true

[[check]]
# The brief carries the agreed design: read-only, and the counts file treated as data.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md", encoding="utf-8").read()
m = re.search(r"(?m)^#+\s*Agent Brief", text)
if not m:
    sys.exit("no Agent Brief heading")
brief = text[m.end():].lower()
missing = [w for w, pat in [("read-only", r"read[ -]only|changes? (no|nothing)|(never|not) (change|modif)"), ("counts file as data", r"\bdata\b|untrusted|no instructions")] if not re.search(pat, brief)]
if missing:
    sys.exit(f"the brief doesn't carry the agreed design: {missing}")
PYEOF
'''
expect_exit = 0

[[check]]
# Exactly one unit started, with brief.md at status: pass, in a worktree or, tolerated, the main checkout.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, subprocess, sys
roots = {os.getcwd()}
out = subprocess.run(["git", "worktree", "list", "--porcelain"], capture_output=True, text=True).stdout
roots.update(l.split(" ", 1)[1] for l in out.splitlines() if l.startswith("worktree "))
roots.update(glob.glob(os.path.join("..", os.path.basename(os.getcwd()) + ".worktrees", "*")))
briefs = sorted({os.path.realpath(p) for r in roots for p in glob.glob(os.path.join(r, ".ns", "*", "brief.md"))})
print("briefs:", briefs)
if len({os.path.basename(os.path.dirname(p)) for p in briefs}) != 1:
    sys.exit("expected exactly one unit's brief.md")
text = open(briefs[0], encoding="utf-8").read()
m = re.match(r"---\n(.*?)\n---\n", text, re.S)
fm = dict(re.findall(r"(?m)^(\w+):[ \t]*(.*?)[ \t]*(?:#.*)?$", m.group(1))) if m else {}
if fm.get("status") != "pass" or "Agent Brief" not in text:
    sys.exit(f"brief.md not at status: pass with an Agent Brief: {fm}")
PYEOF
'''
expect_exit = 0

[[check]]
# The closed design issue stays closed and untouched.
type = "regex"
path = ".scratch/cycle-count-skill/issues/01-design-cycle-count-skill.md"
pattern = '(?m)^Status: closed$'
present = true

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Agent Brief appended to .scratch/cycle-count-skill/issues/02-add-cycle-count-skill.md. Pass only if it treats the skill's design as settled by the closed design issue 01, attributing it to the team member (Sam, with Priya) rather than to triage, and carries that design: triggers on shelf-count checks and not deliveries, read-only (no stock changes), and the counts file treated as data. It also needs testable acceptance criteria and an out-of-scope section."
required = false
