description = "Underspecified bug report ('inventory is broken sometimes'). Under gates: auto, triage should set needs-info with Triage Notes asking specific questions, and not start a unit."
fixture = "py-inventory"
skills = ["ns-triage"]
# ns-contract defines units, worktrees, .ns artifacts, frontmatter and gates that triage writes against.
# ns-setup is left out: the fixture already has every docs/agents/ file, so triage has no reason to load it.
# ns-grilling and ns-domain-modeling are left out on purpose. Triage loads them only in step 4 (grill),
# and every case here runs under `gates: auto`, where the skill says grilling needs a human and the
# issue routes to needs-define or needs-info instead. Installing them would only add noise (ns-grilling
# is model-invocable) without exercising anything these cases check.
# ns-build / ns-define / ns-troubleshoot are not installed either, so the auto hand-off reports the
# routing and stops, and the trial ends at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 10
prompt = """
Triage .scratch/stock-reports/issues/01-inventory-broken-sometimes.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-info`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-triage'
present = false

[[check]]
# Exactly one category is set; either reading is defensible for a report this vague.
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?m)^\**Category:?\**:?\s*`?(bug|enhancement)`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
# At least two questions for the reporter, from the needs-info template.
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?s)What we still need from you.*?\n\s*[-*] .+\n(.*\n)*?\s*[-*] .+'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-reports/issues/01-inventory-broken-sometimes.md"
pattern = '(?m)^#+\s*Agent Brief'
present = false

[[check]]
# No unit started: no brief.md anywhere and no ns/* branch or extra worktree.
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Triage Notes in .scratch/stock-reports/issues/01-inventory-broken-sometimes.md. Pass only if the questions to the reporter are specific and actionable for this codebase (for example which command was run, what output was expected versus seen, whether reservations had expired, a copy of the state file), not generic requests for 'more information', and the notes record what triage already established."
required = false
