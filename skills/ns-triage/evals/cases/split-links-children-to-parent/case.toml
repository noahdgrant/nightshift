description = "The broad request from broad-feature-split, on a tracker whose issue-tracker.md says it has no sub-issues. Triage should split it and link every child to the parent with the fallback: a `Part of #01` line near the top of each child body, after any `Blocked by:` line, which stays the first line after the header lines. The GitHub sub-issue path needs `gh` and is not covered here. The parent's Triage Notes carry a `Children:` list naming each child."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/low-stock/issues/01-low-stock-reordering.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
# Every child links the parent as a whole token (`Part of #01`, not `#011`), with only header lines (`Status:`, `Priority:`, ...) ahead of it, and `Blocked by:` the first non-header body line when present.
# The parent's Triage Notes have a `Children:` list (to the next heading) naming every child by file stem or a `#NN` / list-leading number, not a digit in prose.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, sys
parent_path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
children = sorted(p for p in glob.glob(".scratch/**/*.md", recursive=True)
                  if os.path.realpath(p) != os.path.realpath(parent_path) and "/issues/" in p)
print("children:", children)
if len(children) < 2:
    sys.exit("fewer than two child issues")
notes = open(parent_path, encoding="utf-8").read().split("Triage Notes", 1)[-1]
listing = re.search(r"(?mi)^\W*Children\W*:(.*(?:\n(?!#).*)*)", notes)
if not listing:
    sys.exit("parent's Triage Notes have no Children: list")
part_of = re.compile(r"(?i)\W*Part of:?\**:?\s*#0*1(?!\d)")
header = re.compile(r"[*_]*[A-Z][\w-]*(?: [\w-]+)?[*_]*:")
blocked_by = re.compile(r"(?i)\W*Blocked by:?\**:?\s*(.*)")
for path in children:
    text = open(path, encoding="utf-8").read()
    stem = os.path.splitext(os.path.basename(path))[0]
    num = re.match(r"\d+", stem)
    if not num:
        sys.exit(f"{path}: file name has no numeric prefix")
    num = num.group()
    n = rf"0*{int(num)}(?!\d)"
    named = re.search(rf"(?<![\w-]){re.escape(stem)}(?![\w-])", listing.group(1))
    numbered = re.search(rf"(?m)(?:#|,\s*|\A\s*|^\s*(?:[-*+]|\d+[.)])?\s*[*_`\[]*)(?:#)?{n}", listing.group(1))
    if not (named or numbered):
        sys.exit(f"{path}: not in the parent's Children: list")
    lines = [l.strip() for l in text.splitlines() if l.strip()]
    body = lines[1:] if lines and lines[0].startswith("#") else lines
    body = body[1:] if body and body[0].startswith("🤖") else body
    link = next((i for i, l in enumerate(body) if part_of.match(l)), None)
    if link is None:
        sys.exit(f"{path}: no Part of #01 line")
    first = next((l for l in body if blocked_by.match(l) or not header.match(l)), "")
    if not blocked_by.match(first) and re.search(r"(?mi)^\W*Blocked by", text):
        sys.exit(f"{path}: Blocked by is not the first body line")
    stray = [l for l in body[:link] if not header.match(l)]
    if stray:
        sys.exit(f"{path}: Part of #01 comes after body text {stray[0]!r}")
print(f"ok: {len(children)} children, each Part of #01 and listed under Children:")
PYEOF
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]
