description = "Small, clear feature request whose acceptance criteria leave the storage mechanism to the implementer, listing three options. Under gates: auto, triage should route it to needs-define with Triage Notes naming the open storage decision and its options, write no Agent Brief, and start no unit."
fixture = "py-inventory"
skills = ["ns-triage"]
# Same skill set as feature-needs-define: ns-define is not installed, so the auto hand-off stops at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 10
prompt = """
Triage .scratch/stock-history/issues/01-stock-movement-history.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/stock-history/issues/01-stock-movement-history.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-history/issues/01-stock-movement-history.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(needs-triage|ready-for-agent|ready-for-human|needs-info|wontfix|closed)'
present = false

[[check]]
type = "regex"
path = ".scratch/stock-history/issues/01-stock-movement-history.md"
pattern = '(?m)^#+\s*Agent Brief'
present = false

[[check]]
type = "regex"
path = ".scratch/stock-history/issues/01-stock-movement-history.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
# Triage Notes exist and, below their heading (the issue body above also names the options), list the open
# storage decision with its options.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".scratch/stock-history/issues/01-stock-movement-history.md", encoding="utf-8").read()
m = re.search(r"(?m)^#+\s*Triage Notes", text)
if not m:
    sys.exit("no Triage Notes heading")
notes = text[m.end():].lower()
missing = [w for w, pat in [("storage", r"storage|store|persist"), ("json lines", r"json[ -]?lines|jsonl|ndjson"), ("sqlite", r"sqlite"), ("state file", r"state[ -]file|existing (json )?file")] if not re.search(pat, notes)]
if missing:
    sys.exit(f"Triage Notes don't mention: {missing}")
PYEOF
'''
expect_exit = 0

[[check]]
# No unit started: no brief.md anywhere and no ns/* branch or extra worktree.
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
# Not built and not rejected: tracker edits only.
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Triage Notes in .scratch/stock-history/issues/01-stock-movement-history.md. Pass only if they treat the storage mechanism (state file list, separate JSON Lines file, or SQLite) as an open design decision for a human, leave it unchosen (a recommendation is fine if it is marked as one, not as settled), and route the issue to ns-define. Fail if they pick the mechanism as settled, or send the issue to needs-define for being large or unclear instead of for the open decision."
required = false
