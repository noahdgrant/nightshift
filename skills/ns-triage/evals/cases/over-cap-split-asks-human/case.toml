description = "Clear feature request holding eight independent admin commands. Under gates: auto, triage should find more shippable behaviours than the split cap of 5, file no children, post Triage Notes saying the split needs a human, move the parent to needs-define or needs-info, and start no unit."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/stock-admin/issues/01-stock-admin-commands.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/stock-admin/issues/01-stock-admin-commands.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(needs-define|needs-info)`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-admin/issues/01-stock-admin-commands.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(closed|wontfix|needs-triage|ready-for-agent)'
present = false

[[check]]
type = "regex"
path = ".scratch/stock-admin/issues/01-stock-admin-commands.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-admin/issues/01-stock-admin-commands.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-admin/issues/01-stock-admin-commands.md"
pattern = '(?ims)^#+\s*Triage Notes.*?(\bcap\b|exceed|too many|more than (5|five)|over (the )?(5|five))'
present = true

[[check]]
type = "command"
run = '''
[ "$(find .scratch -name '*.md' ! -path '.scratch/stock-admin/issues/01-stock-admin-commands.md' | wc -l)" -eq 0 ]
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Triage Notes in .scratch/stock-admin/issues/01-stock-admin-commands.md. Pass only if they list the shippable behaviours found (more than five), say the split was not filed because it is over the cap or too many children, and ask a human to decide how to break the request up."
required = false
