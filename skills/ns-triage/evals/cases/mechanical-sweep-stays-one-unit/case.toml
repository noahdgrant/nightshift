description = "Mechanical sweep: switch the date format in 30 generated report modules and their golden tests, about 800 changed lines, past the 400-line soft limit but under the 1200 split threshold. Under gates: auto, triage should size it and keep it one unit, since a repeated mechanical change is no reason to split: mark it ready-for-agent, keep priority:medium, append an Agent Brief with a Size line, file no child issues, and start one unit."
fixture = "py-inventory"
skills = ["ns-triage"]
# Same skill set as bug-ready-for-agent: ns-build is not installed, so the auto hand-off stops at triage.
extra_skills = ["ns-contract"]
requires = ["python"]
timeout_minutes = 15
prompt = """
Triage .scratch/report-dates/issues/01-reports-print-iso-dates.md. gates: auto
"""

[setup]
# 30 report modules, each formatting dates with its own strftime('%d/%m/%Y'), and a golden test for each.
commands = ["python3 -I ../make_reports.py"]

[[check]]
type = "regex"
path = ".scratch/report-dates/issues/01-reports-print-iso-dates.md"
pattern = '(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/report-dates/issues/01-reports-print-iso-dates.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(needs-triage|needs-define|needs-info|closed|wontfix)'
present = false

[[check]]
type = "regex"
path = ".scratch/report-dates/issues/01-reports-print-iso-dates.md"
pattern = '(?m)^\**Priority:?\**:?\s*`?priority:medium`?\s*$'
present = true

[[check]]
# Step 5 sized it: the Agent Brief carries a non-empty Size line.
type = "regex"
path = ".scratch/report-dates/issues/01-reports-print-iso-dates.md"
pattern = '(?si)#+\s*Agent Brief.*\n[*_ \t]*Size:[*_]*[ \t]*[^\s*_]'
present = true

[[check]]
# Not split: the issue is the only Markdown file under .scratch/.
type = "command"
run = '''
others=$(find .scratch -name '*.md' ! -path .scratch/report-dates/issues/01-reports-print-iso-dates.md)
echo "other issue files: ${others:-none}"
[ -z "$others" ]
'''
expect_exit = 0

[[check]]
# Exactly one unit started, with brief.md at status: pass, in a worktree or, tolerated, the main checkout.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, subprocess, sys
roots = {os.getcwd()}
out = subprocess.run(["git", "worktree", "list", "--porcelain"], capture_output=True, text=True).stdout
roots.update(l.split(" ", 1)[1] for l in out.splitlines() if l.startswith("worktree "))
roots.update(glob.glob(os.path.join("..", os.path.basename(os.getcwd()) + ".worktrees", "*")))
briefs = sorted({os.path.realpath(p) for r in roots for p in glob.glob(os.path.join(r, ".ns", "*", "brief.md"))})
print("briefs:", briefs)
if len({os.path.basename(os.path.dirname(p)) for p in briefs}) != 1:
    sys.exit("expected exactly one unit's brief.md")
text = open(briefs[0], encoding="utf-8").read()
m = re.match(r"---\n(.*?)\n---\n", text, re.S)
fm = dict(re.findall(r"(?m)^(\w+):[ \t]*(.*?)[ \t]*(?:#.*)?$", m.group(1))) if m else {}
if fm.get("status") != "pass" or "Agent Brief" not in text:
    sys.exit(f"brief.md not at status: pass with an Agent Brief: {fm}")
PYEOF
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Agent Brief appended to .scratch/report-dates/issues/01-reports-print-iso-dates.md. Pass only if: the triage records a size estimate (files or modules, new tests, rough lines) that covers all 30 reports and their tests, and keeps the request as one unit rather than splitting it, giving the reason that it is one repeated mechanical change (not that it is small); the brief's acceptance criteria cover every report and its test; and its Touches name src/inventory/reports and tests/reports."
required = false
