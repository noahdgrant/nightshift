description = "A ready-for-agent brief for a CLI change (an `inventory remove-item` command) lists the failure modes it found on the code path: the brief comment carries a `**Failure modes:**` section with at least one entry that is not a `none` one-liner."
fixture = "py-inventory"
skills = ["ns-triage"]
# ns-build is not installed, so the auto hand-off stops at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/stock-items/issues/01-remove-item-command.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/stock-items/issues/01-remove-item-command.md"
pattern = '(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$'
present = true

[[check]]
# The Failure modes section has text on its own line or in the lines under it,
# up to the next field label or heading, and is not a "none" one-liner or the
# bare `(required)` template marker.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".scratch/stock-items/issues/01-remove-item-command.md", encoding="utf-8").read()
label = re.compile(r"^[ \t>#*_-]*Failure modes:?[*_]*:?(.*)$", re.I)
fields = "Edge cases|Out of scope|Decisions|Key interfaces|Acceptance criteria|Touches|Size|Route|Summary|Category|Current behavior|Desired behavior|Assumptions"
stop = re.compile(r"^(?:#|(?:[-*][ \t]+)?(?:\*\*|__)?(?:" + fields + r")[*_]*(?::|$))", re.I)
lines = text.splitlines()
start = next((i for i, l in enumerate(lines) if label.match(l)), None)
if start is None:
    sys.exit("no Failure modes section in the brief comment")
body = [label.match(lines[start]).group(1)]
for l in lines[start + 1:]:
    if stop.match(re.sub(r"^[ \t>]+", "", l)):
        break
    body.append(l)
bullet = re.compile(r"^\s*(?:[-*]|\d+[.)])\s+")
entries = []
base = None
for l in body:
    l = re.sub(r"^[ \t]*>[ \t>]*", "", l).rstrip()
    if not l.strip():
        continue
    indent = len(l) - len(l.lstrip())
    top = bullet.match(l) and (base is None or indent <= base)
    if top:
        base = indent if base is None else base
    if top or not entries:
        entries.append(bullet.sub("", l).strip())
    else:
        entries[-1] += " " + l.strip()
entries = [re.sub(r"[*_`]", "", e).strip() for e in entries]
entries = [e for e in entries if e and e.lower() != "(required)"]
print("failure modes:", entries)
none = re.compile(r"none(?:\s*[;.:,(\u2014\u2013]|\s+[-\u2014\u2013]|\s*$)", re.I)
if not any(not none.match(e) for e in entries):
    sys.exit("Failure modes section is empty or only says none")
PYEOF
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]
