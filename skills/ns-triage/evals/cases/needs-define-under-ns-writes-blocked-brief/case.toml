description = "The open storage decision from design-choice-needs-define, triaged under `ns run` after `ns watch` moved the issue to in-progress. Triage should route it to needs-define and write brief.md with status: blocked, cause: needs_human and next: define, a brief that passes `ns artifact check --phase triage`, and keep the issue's Status: in-progress for ns to move."
fixture = "py-inventory"
skills = ["ns-triage"]
# ns-define is not installed, so the trial ends at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 10
prompt = """
Load the `ns-triage` skill and run it for unit `01-stock-movement-history` (issue .scratch/stock-history/issues/01-stock-movement-history.md). gates: auto.
Phase: triage (attempt 1). End by writing the phase's artifact under .ns/01-stock-movement-history/ with its frontmatter status.
"""

# The checks below run `ns artifact check`; without it on PATH they would fail for the wrong reason.
[[check]]
type = "command"
run = "ns artifact check --help >/dev/null"
expect_exit = 0

[[check]]
type = "regex"
path = ".scratch/stock-history/issues/01-stock-movement-history.md"
pattern = '(?m)^\**Status:?\**:?\s*`?in-progress`?\s*$'
present = true

[[check]]
# A blocked brief: needs-define's next and status, and the contract's cause for it, never cause: none.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, re, sys
briefs = glob.glob(".ns/01-*/brief.md")
if not briefs:
    sys.exit("no .ns/01-*/brief.md")
for path in briefs:
    text = open(path, encoding="utf-8").read()
    m = re.match(r"---\n(.*?)\n---\n", text, re.S)
    fm = {k: v.strip("'\"") for k, v in re.findall(r"(?m)^(\w+):[ \t]*(.*?)[ \t]*(?:#.*)?$", m.group(1))} if m else {}
    got = (fm.get("status"), fm.get("cause"), fm.get("next"))
    print(f"{path}: status, cause, next = {got}")
    if got != ("blocked", "needs_human", "define"):
        sys.exit(1)
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
set -e
found=0
for b in .ns/01-*/brief.md; do
  [ -e "$b" ] || continue
  found=1
  ns artifact check "$b" --phase triage | tee /dev/stderr | grep -q '"ok": *true'
done
[ "$found" -eq 1 ]
'''
expect_exit = 0

[[check]]
# needs-define starts no unit: no ns/* branch and no extra worktree.
type = "command"
run = '''
! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]
