description = "Clear request holding two behaviours in disjoint files: a state-file backup (storage) and a cap on reservation TTL (warehouse). Neither needs the other, so the children can run in parallel. Under gates: auto, triage should size it and split it: file two or more child issues with their own Agent Briefs and no Blocked by line, mark them ready-for-agent with the parent's priority, close nothing, move the parent to needs-define with Triage Notes listing the children, and start no unit."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/stock-safety/issues/01-stock-safety.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/stock-safety/issues/01-stock-safety.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-safety/issues/01-stock-safety.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(closed|wontfix|needs-triage|ready-for-agent)'
present = false

[[check]]
type = "regex"
path = ".scratch/stock-safety/issues/01-stock-safety.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/stock-safety/issues/01-stock-safety.md"
pattern = '🤖 \*Posted by nightshift, an AI agent\.\*'
present = true

[[check]]
# Two or more ready children, none blocked on another: they can run in parallel.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, sys
parent_path = ".scratch/stock-safety/issues/01-stock-safety.md"
parent = open(parent_path, encoding="utf-8").read()
children = sorted(p for p in glob.glob(".scratch/**/*.md", recursive=True)
                  if os.path.realpath(p) != os.path.realpath(parent_path) and "/issues/" in p)
notes = parent.split("Triage Notes", 1)[-1]
print("children:", children)
if len(children) < 2:
    sys.exit("fewer than two child issues")
for path in children:
    text = open(path, encoding="utf-8").read()
    stem = os.path.splitext(os.path.basename(path))[0]
    prefix = re.match(r"\d+", stem)
    if not prefix:
        sys.exit(f"{path}: file name has no numeric prefix")
    num = prefix.group()
    checks = {
        "ready-for-agent": re.search(r"(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$", text),
        "priority:medium": re.search(r"(?m)^\**Priority:?\**:?\s*`?priority:medium`?\s*$", text),
        "Agent Brief": re.search(r"(?m)^#+\s*Agent Brief", text),
        "criteria": re.search(r"- \[ \] .+", text),
        "Size": re.search(r"(?mi)^\W*Size:", text),
        "Touches": re.search(r"(?mi)^\W*Touches:", text),
        "no Blocked by": not re.search(r"(?mi)^\W*Blocked by", text),
        "listed in parent's Triage Notes": stem in notes or re.search(rf"(?<!\d)(?:{num}|{int(num)})(?!\d)", notes),
    }
    missing = [k for k, v in checks.items() if not v]
    if missing:
        sys.exit(f"{path}: missing {missing}")
print(f"ok: {len(children)} parallel children")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read .scratch/stock-safety/issues/. Pass only if: the triage records a size estimate (files or modules, new tests, rough lines); the request is split into one child for the state-file backup and one for the reservation TTL cap, with the reason that their files don't overlap or that they are separate behaviours, not that the work is large; each child's Touches name only its own side (storage for the backup, the warehouse for the cap); each child's Agent Brief has its own testable acceptance criteria; and the parent's Triage Notes list every child."
required = false
