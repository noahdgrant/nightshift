description = "Clear but broad feature request (reorder points, a low-stock status filter, a CSV reorder report). Under gates: auto, triage should size it, find more than one shippable behaviour, and split it: file two or more child issues with their own Agent Briefs and Blocked by lines, mark them ready-for-agent with the parent's priority, close nothing, move the parent to needs-define with Triage Notes listing the children, and start no unit."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/low-stock/issues/01-low-stock-reordering.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(closed|wontfix|needs-triage|ready-for-agent)'
present = false

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, sys
parent_path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
parent = open(parent_path, encoding="utf-8").read()
children = sorted(p for p in glob.glob(".scratch/**/*.md", recursive=True)
                  if os.path.realpath(p) != os.path.realpath(parent_path) and "/issues/" in p)
notes = parent.split("Triage Notes", 1)[-1]
print("children:", children)
if len(children) < 2:
    sys.exit("fewer than two child issues")
blockers = {}
for path in children:
    text = open(path, encoding="utf-8").read()
    stem = os.path.splitext(os.path.basename(path))[0]
    num = stem.split("-")[0]
    checks = {
        "ready-for-agent": re.search(r"(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$", text),
        "priority:medium": re.search(r"(?m)^\**Priority:?\**:?\s*`?priority:medium`?\s*$", text),
        "Agent Brief": re.search(r"(?m)^#+\s*Agent Brief", text),
        "criteria": re.search(r"- \[ \] .+", text),
        "Size": re.search(r"(?mi)^\W*Size:", text),
        "listed in parent's Triage Notes": stem in notes or re.search(rf"(?<!\d)(?:{num}|{int(num)})(?!\d)", notes),
    }
    missing = [k for k, v in checks.items() if not v]
    if missing:
        sys.exit(f"{path}: missing {missing}")
    m = re.search(r"(?mi)^\W*Blocked by:?\**:?\s*\D{0,3}(\d+)", text)
    blockers[path] = int(m.group(1)) if m else None
numbers = {int(os.path.basename(p).split("-")[0]): p for p in children}
roots = [p for p, n in blockers.items() if n is None]
if len(roots) != 1:
    sys.exit(f"expected exactly one child without Blocked by, got {roots}")
root = roots[0]
first = open(root, encoding="utf-8").read().splitlines()[0]
if not re.search(r"(?i)reorder[- _]?point", os.path.basename(root) + first):
    sys.exit(f"the unblocked child is not the reorder-point child: {root}")
for path, n in blockers.items():
    if n is not None and numbers.get(n) != root:
        sys.exit(f"{path}: Blocked by #{n} does not resolve to the reorder-point child {root}")
print(f"ok: {len(children)} children, all dependents blocked by {root}")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read .scratch/low-stock/issues/. Pass only if: the triage records a size estimate (files or modules, new tests, rough lines); the request is split along shippable behaviours (reorder points first, then the low-stock status filter and the CSV reorder report, separately or the latter two together only with a stated reason); each child's Agent Brief has its own testable acceptance criteria; the Blocked by lines follow the real order (the filter and report wait on reorder points, not the reverse); and the parent's Triage Notes list every child."
required = false
