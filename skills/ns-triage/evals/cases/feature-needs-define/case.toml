description = "Large, fuzzy feature request (multiple warehouses with transfers). Under gates: auto, triage should set enhancement + needs-define, keep the issue's existing priority:low, and write Triage Notes listing open questions, and not start a unit."
fixture = "py-inventory"
skills = ["ns-triage"]
# ns-contract defines units, worktrees, .ns artifacts, frontmatter and gates that triage writes against.
# ns-setup is left out: the fixture already has every docs/agents/ file, so triage has no reason to load it.
# ns-grilling and ns-domain-modeling are left out on purpose. Triage loads them only in step 4 (grill),
# and every case here runs under `gates: auto`, where the skill says grilling needs a human and the
# issue routes to needs-define or needs-info instead. Installing them would only add noise (ns-grilling
# is model-invocable) without exercising anything these cases check.
# ns-build / ns-define / ns-troubleshoot are not installed either, so the auto hand-off reports the
# routing and stops, and the trial ends at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 10
prompt = """
Triage .scratch/multi-warehouse/issues/01-support-multiple-warehouses.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-triage'
present = false

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^\**Category:?\**:?\s*`?enhancement`?\s*$'
present = true

[[check]]
# The reporter's existing priority is kept, and stays the only one.
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^\**Priority:?\**:?\s*`?priority:low`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^\**Priority:?.*priority:(high|medium)'
present = false

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
type = "regex"
path = ".scratch/multi-warehouse/issues/01-support-multiple-warehouses.md"
pattern = '(?m)^#+\s*Agent Brief'
present = false

[[check]]
# No unit started: no brief.md anywhere and no ns/* branch or extra worktree.
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
# Not rejected: nothing recorded as out of scope, no code written.
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Triage Notes in .scratch/multi-warehouse/issues/01-support-multiple-warehouses.md. Pass only if they separate what is settled from the open questions, and the open questions are the real design decisions (how reservations pick a site, what 'in transit' means for available stock, state-file shape and migration, how the single-site CLI keeps working), routed to ns-define rather than answered by guesswork."
required = false
