description = "Clear, reproducible bug report for seeded defect (a) in the local .scratch/ tracker. Under gates: auto, triage should reproduce it, mark it bug + ready-for-agent, append an Agent Brief, and start the unit (worktree + .ns/<unit>/brief.md)."
fixture = "py-inventory"
skills = ["ns-triage"]
# ns-contract defines units, worktrees, .ns artifacts, frontmatter and gates that triage writes against.
# ns-setup is left out: the fixture already has every docs/agents/ file, so triage has no reason to load it.
# ns-grilling and ns-domain-modeling are left out on purpose. Triage loads them only in step 4 (grill),
# and every case here runs under `gates: auto`, where the skill says grilling needs a human and the
# issue routes to needs-define or needs-info instead. Installing them would only add noise (ns-grilling
# is model-invocable) without exercising anything these cases check.
# ns-build / ns-define / ns-troubleshoot are not installed either, so the auto hand-off reports the
# routing and stops, and the trial ends at triage.
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/reservations/issues/01-full-quantity-reservation-rejected.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = '(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$'
present = true

[[check]]
# Exactly one state: the old one is gone.
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-triage'
present = false

[[check]]
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = '(?m)^\**Category:?\**:?\s*`?bug`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = '(?m)^#+\s*Agent Brief'
present = true

[[check]]
# Testable acceptance criteria: the brief's checklist has at least two items.
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = '(?s)Acceptance criteria.*?\n\s*- \[ \] .+\n(.*\n)*?\s*- \[ \] .+'
present = true

[[check]]
type = "regex"
path = ".scratch/reservations/issues/01-full-quantity-reservation-rejected.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
# The unit was started: brief.md exists with status: pass and a base, in the worktree `ns worktree new`
# (or the git-worktree fallback) made at ../<repo>.worktrees/<unit>, or, tolerated, in the main checkout's .ns/.
# The unit id should be 01-full-quantity-reservation-rejected; any 01-* slug is accepted.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, subprocess, sys
roots = {os.getcwd()}
out = subprocess.run(["git", "worktree", "list", "--porcelain"], capture_output=True, text=True).stdout
roots.update(l.split(" ", 1)[1] for l in out.splitlines() if l.startswith("worktree "))
roots.update(glob.glob(os.path.join("..", os.path.basename(os.getcwd()) + ".worktrees", "01-*")))
briefs = sorted({os.path.realpath(p) for r in roots for p in glob.glob(os.path.join(r, ".ns", "01-*", "brief.md"))})
if not briefs:
    sys.exit("no .ns/01-*/brief.md in the main checkout or any worktree")
for path in briefs:
    text = open(path, encoding="utf-8").read()
    m = re.match(r"---\n(.*?)\n---\n", text, re.S)
    if not m:
        print(f"{path}: no frontmatter"); continue
    fm = {k: v.strip("'\"") for k, v in re.findall(r"(?m)^(\w+):[ \t]*(.*?)[ \t]*(?:#.*)?$", m.group(1))}
    ok = fm.get("status") == "pass" and fm.get("base", "") != "" and "Agent Brief" in text and "- [ ]" in text
    print(f"{path}: status={fm.get('status')!r} base={fm.get('base')!r} ok={ok}")
    if ok:
        sys.exit(0)
sys.exit("no brief.md with status: pass, a base, and an Agent Brief with acceptance criteria")
PYEOF
'''
expect_exit = 0

[[check]]
# Triage edits the tracker and artifacts only. It must not fix the bug itself (ns-build is not installed).
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read the Agent Brief appended to .scratch/reservations/issues/01-full-quantity-reservation-rejected.md. Pass only if: it states current and desired behaviour (reserving exactly the available quantity must succeed; one more must still be rejected), names symbols such as Warehouse.reserve or InsufficientStock rather than file paths or line numbers, has independently testable acceptance criteria, has an out-of-scope section, and the triage reports that it reproduced the bug before writing the brief."
required = false
