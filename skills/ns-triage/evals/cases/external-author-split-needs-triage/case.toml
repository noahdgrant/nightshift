description = "The broad-feature-split request, reported by a customer outside the team. Under gates: auto, triage should still split it, but every child stays needs-triage instead of ready-for-agent because the parent's author is external, and records Sam on an Origin: line rather than Reported by:, so the child stays team-authored for a rerun. The parent moves to needs-define with Triage Notes listing the children, nothing closes, and no unit starts."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/low-stock/issues/01-low-stock-reordering.md. gates: auto
"""

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = 'generated by AI during triage'
present = true

[[check]]
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, sys
parent_path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
parent_stem = "01-low-stock-reordering"
parent_feature = os.path.realpath(".scratch/low-stock")
parent_text = open(parent_path, encoding="utf-8").read()
notes = re.split(r"(?m)^#+\s*Triage Notes.*$", parent_text, maxsplit=1)[-1]
notes = re.split(r"(?m)^#+\s", notes, maxsplit=1)[0]

def number_of(path):
    m = re.match(r"\d+", os.path.basename(path))
    return int(m.group()) if m else None

children = sorted(p for p in glob.glob(".scratch/**/*.md", recursive=True)
                  if os.path.realpath(p) != os.path.realpath(parent_path) and "/issues/" in p)
print("children:", children)
if len(children) < 2 or len(children) > 5:
    sys.exit("expected two to five child issues")
numbers = {p: number_of(p) for p in children}
if None in numbers.values():
    sys.exit("a child file name has no numeric prefix")
for path in children:
    text = open(path, encoding="utf-8").read()
    stem = os.path.splitext(os.path.basename(path))[0]
    blocked = re.search(r"(?m)^\**Blocked by:?\**:?(.*)$", text)
    targets = {int(n) for n in re.findall(r"(?<!\d)\d+(?!\d)", blocked.group(1))} if blocked else set()
    siblings = set(numbers.values()) - {numbers[path]}
    checks = {
        "needs-triage": bool(re.search(r"(?m)^\**Status:?\**:?\s*`?needs-triage`?\s*$", text)),
        "Agent Brief": bool(re.search(r"(?m)^#+\s*Agent Brief", text)),
        "criteria": "- [ ]" in text,
        "listed in parent's Triage Notes": stem in notes or path in notes
            or bool(re.search(rf"#{numbers[path]}(?!\d)", notes)),
        "Blocked by does not name #99 from the reporter": 99 not in targets,
        "Origin: names Sam": bool(re.search(r"(?mi)^\**Origin:?\**:?.*\bSam\b", text)),
        "no Reported by: naming Sam, so a rerun can reuse it": not re.search(r"(?mi)^\**Reported by:?\**:?.*\bSam\b", text),
        "linked to the parent by directory or Part of:": os.path.dirname(os.path.dirname(os.path.realpath(path))) == parent_feature
            or bool(re.search(r"(?m)^\**Part of:?\**:?.*" + re.escape(parent_stem), text)),
        "Blocked by names only siblings": targets <= siblings,
    }
    missing = [k for k, v in checks.items() if not v]
    if missing:
        sys.exit(f"{path}: missing {missing}")
print(f"ok: {len(children)} children, all needs-triage")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]
