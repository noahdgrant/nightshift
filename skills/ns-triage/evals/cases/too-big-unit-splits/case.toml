description = "The low-stock request (three behaviours that all edit the CLI and the warehouse, about 300 changed lines) in a repo whose stack.md sets a split threshold of 150. The touches overlap, so rule 1 fails, and the behaviours depend on one another, but one unit would be past the threshold (rule 3), so triage splits it anyway. Under gates: auto, triage should file two or more child issues with their own Agent Briefs and Size and Touches lines, mark them ready-for-agent with the parent's priority, close nothing, move the parent to needs-define with Triage Notes listing the children, and start no unit."
fixture = "py-inventory"
skills = ["ns-triage"]
extra_skills = ["ns-contract"]
requires = []
timeout_minutes = 15
prompt = """
Triage .scratch/low-stock/issues/01-low-stock-reordering.md. gates: auto
"""

[setup]
# Committed on main so the figures do not count toward the unit's own diff.
commands = [
  "printf '\\n## Unit size\\n\\nunit size: soft 20, split 150\\n' >> docs/agents/stack.md",
  "git commit -q -am 'docs(agents): set a small split threshold'",
]

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?needs-define`?\s*$'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^\**Status:?\**:?\s*`?(closed|wontfix|needs-triage|ready-for-agent)'
present = false

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '(?m)^#+\s*Triage Notes'
present = true

[[check]]
type = "regex"
path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
pattern = '🤖 \*Posted by nightshift, an AI agent\.\*'
present = true

[[check]]
# Two or more ready children, each with its own brief.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, os, re, sys
parent_path = ".scratch/low-stock/issues/01-low-stock-reordering.md"
parent = open(parent_path, encoding="utf-8").read()
children = sorted(p for p in glob.glob(".scratch/**/*.md", recursive=True)
                  if os.path.realpath(p) != os.path.realpath(parent_path) and "/issues/" in p)
notes = parent.split("Triage Notes", 1)[-1]
print("children:", children)
if len(children) < 2:
    sys.exit("fewer than two child issues")
for path in children:
    text = open(path, encoding="utf-8").read()
    stem = os.path.splitext(os.path.basename(path))[0]
    prefix = re.match(r"\d+", stem)
    if not prefix:
        sys.exit(f"{path}: file name has no numeric prefix")
    num = prefix.group()
    checks = {
        "ready-for-agent": re.search(r"(?m)^\**Status:?\**:?\s*`?ready-for-agent`?\s*$", text),
        "priority:medium": re.search(r"(?m)^\**Priority:?\**:?\s*`?priority:medium`?\s*$", text),
        "Agent Brief": re.search(r"(?m)^#+\s*Agent Brief", text),
        "criteria": re.search(r"- \[ \] .+", text),
        "Size": re.search(r"(?mi)^\W*Size:", text),
        "Touches": re.search(r"(?mi)^\W*Touches:", text),
                "listed in parent's Triage Notes": stem in notes or re.search(rf"(?<!\d)(?:{num}|{int(num)})(?!\d)", notes),
    }
    missing = [k for k, v in checks.items() if not v]
    if missing:
        sys.exit(f"{path}: missing {missing}")
print(f"ok: {len(children)} children")
PYEOF
'''
expect_exit = 0

[[check]]
type = "command"
run = '''
! ls .ns/*/brief.md ../"$(basename "$PWD")".worktrees/*/.ns/*/brief.md 2>/dev/null | grep -q . && ! git branch --list 'ns/*' | grep -q . && [ "$(git worktree list | wc -l)" -eq 1 ]
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".scratch/**", ".ns/**", "GLOSSARY.md", "docs/adr/**"]

[[check]]
type = "judge"
rubric = "Read .scratch/low-stock/issues/. Pass only if: the triage records a size estimate past the split threshold of 150 changed lines (files or modules, new tests, rough lines); the request is split into two or more children covering reorder points, the --low filter and the reorder report; the stated reason is that one unit would be too big for the threshold, even though the children touch the same files; each child's Agent Brief has its own testable acceptance criteria and Touches; and the parent's Triage Notes list every child."
required = false
