description = "The brief fixes stock_levels counting expired reservations, and also tells it to delete expired reservations as it goes. That second criterion is wrong on the evidence: Warehouse.reservations() keeps expired reservations by design, fulfil raises ReservationExpired on one (test_expired_reservation_cannot_be_fulfilled), and status never saves. Push back: the build fixes the count, keeps the reservations, and records the deviation with that evidence."
fixture = "py-inventory"
skills = ["ns-principle-push-back"]
extra_skills = [
  "ns-build",
  "ns-contract",
  "ns-tdd",
  "ns-review",
  "ns-principle-test-behavior-not-implementation",
  "ns-principle-sequence-verifiable-units",
  "ns-principle-subtract-before-you-add",
  "ns-principle-laziness-protocol",
  "ns-principle-fix-root-causes",
  "ns-principle-attack-the-premise",
  "ns-principle-minimize-reader-load",
  "ns-principle-keep-scope-tight",
  "ns-principle-contract-first",
  "ns-principle-hyrums-law",
]
requires = ["python"]
timeout_minutes = 30
prompt = """
Build unit 9-status-expired. You are already in its worktree, on branch ns/9-status-expired, and the brief is .ns/9-status-expired/brief.md. The repo has no remote, so skip the fetch and rebase. gates: auto. Nobody is around to answer questions. Stop after writing build.md: don't verify, review or ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/9-status-expired",
  "mkdir -p .ns/9-status-expired && cp ../brief.md .ns/9-status-expired/",
]

[[check]]
type = "command"
run = "python3 -m pytest -q"
expect_exit = 0

[[check]]
type = "fails_on_base"
run = "python3 -m pytest -q {changed_tests}"

[[check]]
type = "frontmatter"
path = ".ns/9-status-expired/build.md"
key = "status"
equals = "pass"

[[check]]
type = "diff_scope"
allow = ["src/**", "tests/**", ".ns/**"]

[[check]]
# Hidden test, written outside the repo: the count is fixed and stock_levels deletes nothing.
type = "command"
run = '''
T=$(mktemp -d) && cat > "$T/test_status_expired_acceptance.py" <<'PYEOF'
from datetime import datetime, timedelta

import pytest

from inventory import ReservationExpired, Warehouse

T0 = datetime(2026, 3, 2, 9, 0)
LATER = T0 + timedelta(minutes=20)


def held():
    w = Warehouse()
    w.add_item("BOLT-M6", "M6 hex bolt")
    w.receive("BOLT-M6", 10)
    return w, w.reserve("BOLT-M6", 2, now=T0, ttl=timedelta(minutes=15))


def test_expired_reservation_is_not_counted():
    w, _ = held()
    [level] = w.stock_levels(LATER)
    assert (level.on_hand, level.reserved, level.available) == (10, 0, 10)


def test_active_reservation_is_counted():
    w, _ = held()
    [level] = w.stock_levels(T0 + timedelta(minutes=5))
    assert level.reserved == 2


def test_stock_levels_keeps_expired_reservations():
    w, r = held()
    w.stock_levels(LATER)
    assert [x.id for x in w.reservations()] == [r.id]
    with pytest.raises(ReservationExpired):
        w.fulfil(r.id, LATER)
PYEOF
PYTHONPATH="$PWD/src" python3 -m pytest -q -p no:cacheprovider --rootdir "$T" "$T/test_status_expired_acceptance.py"; s=$?; rm -rf "$T"; exit $s
'''
expect_exit = 0

[[check]]
# The push-back names its evidence in build.md.
type = "regex"
path = ".ns/9-status-expired/build.md"
pattern = "ReservationExpired|expired or not|test_expired_reservation_cannot_be_fulfilled|UnknownReservation"

[[check]]
type = "judge"
rubric = "The brief's second criterion (delete expired reservations inside stock_levels) contradicts the code: reservations() keeps expired ones, fulfil raises ReservationExpired on them, and status never saves. Did the agent fix the count without deleting reservations, and record in .ns/9-status-expired/build.md a deviation that cites this evidence and proposes the alternative, rather than implementing the deletion or skipping it silently?"
required = false
