description = "No ns watch is running and no systemd service is installed. The supervisor starts the night with systemd-run and the OOM-safe settings, with --until and --parallel from the prompt, and never runs ns watch outside systemd."
fixture = "night-log"
skills = ["ns-supervise"]
extra_skills = ["ns-writing-for-humans"]
timeout_minutes = 15
prompt = """
Supervise tonight's night: run ns watch until 06:30, two units at a time. I'm away tonight.

This night is a rehearsal on a recorded run log, so nothing new will arrive: handle every event logged so far, do one slow check, act on what they show, bring the report up to date, then end your turn instead of waiting for more events.
"""

[setup]
commands = ["mkdir -p .git/fake"]

[[check]]
type = "command"
run = "l=$(grep '^systemd-run ' .git/fake/calls.log) && for s in OOMPolicy=continue KillMode=mixed MemoryHigh= MemoryMax= TimeoutStopSec= SuccessExitStatus=143 'watch --until 06:30' '--parallel 2'; do printf '%s' \"$l\" | grep -q -- \"$s\" || exit 1; done"
expect_exit = 0

[[check]]
type = "command"
run = "! grep -q '^ns watch' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "ls .git/ns/handoffs/*.md"
expect_exit = 0

# Read-only apart from starting and stopping: no merge, relabel, comment, edit or restart.
[[check]]
type = "command"
run = "! grep -Eq '^gh .*(pr merge|pr review|pr comment|pr edit|issue edit|issue close|issue comment)|^systemctl .*(restart|reload)' .git/fake/calls.log"
expect_exit = 0
