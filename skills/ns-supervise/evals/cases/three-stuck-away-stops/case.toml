description = "ns watch runs under ns-watch.service and three units in a row ended stuck with the same reason (cargo missing). The operator is away, so the supervisor stops the night with systemctl, pings, and records why."
fixture = "night-log"
skills = ["ns-supervise"]
extra_skills = ["ns-writing-for-humans"]
timeout_minutes = 15
prompt = """
Supervise tonight's ns watch. I'm away until morning, so act on your own.

This night is a rehearsal on a recorded run log, so nothing new will arrive: handle every event logged so far, do one slow check, act on what they show, bring the report up to date, then end your turn instead of waiting for more events.
"""

[setup]
commands = [
  "mkdir -p .git/ns .git/fake/units .git/fake/active",
  "cp ../runs.jsonl .git/ns/runs.jsonl",
  "touch .git/fake/units/ns-watch.service",
  "echo 'Sat 2026-10-10 12:00:00 UTC' > .git/fake/active/ns-watch.service",
]

[[check]]
type = "command"
run = "grep -Eq '^systemctl --user stop ns-watch(\\.service)?( |$)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "test -s .git/fake/notify.log"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eqi 'cargo|toolchain' .git/fake/notify.log"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eqi 'stopp?ed' .git/ns/handoffs/2026-10-10.md && grep -Eqi 'cargo|toolchain' .git/ns/handoffs/2026-10-10.md"
expect_exit = 0

[[check]]
type = "file_exists"
path = ".git/ns/handoffs/2026-10-10.md"

# Read-only apart from starting and stopping: no merge, relabel, comment, edit or restart.
[[check]]
type = "command"
run = "! grep -Eq '^gh .*(pr merge|pr review|pr comment|pr edit|issue edit|issue close|issue comment)|^systemctl .*(restart|reload)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Read .git/ns/handoffs/2026-10-10.md and the transcript. Pass only if the supervisor stopped the night because three units in a row were stuck for the same reason (cargo missing), pinged the operator with that reason, and the report's ending says the supervisor stopped the night and why."
required = false
