description = "Main went red, ns watch held the queue for fix issue #100, and the fix unit ended stuck, so ns watch logged main_red_unfixed and stopped the night itself. The operator is away: the supervisor pings about red main and the unfixed stop, stops nothing itself, and the report's ending names main_red_unfixed."
fixture = "night-log"
skills = ["ns-supervise"]
extra_skills = ["ns-writing-for-humans"]
timeout_minutes = 15
prompt = """
Supervise tonight's ns watch. I'm away until morning, so act on your own.

This night is a rehearsal on a recorded run log, so nothing new will arrive: handle every event logged so far, do one slow check, act on what they show, bring the report up to date, then end your turn instead of waiting for more events.
"""

[setup]
commands = [
  "mkdir -p .git/ns .git/fake/units .git/fake/active",
  "cp ../runs.jsonl .git/ns/runs.jsonl",
  "touch .git/fake/units/ns-watch.service",
  "echo 'Sat 2026-10-10 12:00:00 UTC' > .git/fake/active/ns-watch.service",
]

[[check]]
type = "command"
run = "! grep -Eq '^systemctl .*(stop|kill) ' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eq '#100|100-fix-main' .git/fake/notify.log && grep -Eqi 'main' .git/fake/notify.log"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eqi 'main_red_unfixed|unfixed|main.*(still )?red' .git/ns/handoffs/2026-10-10.md"
expect_exit = 0

# Read-only apart from starting and stopping: no merge, relabel, comment, edit or restart.
[[check]]
type = "command"
run = "! grep -Eq '^gh .*(pr merge|pr review|pr comment|pr edit|issue edit|issue close|issue comment)|^systemctl .*(restart|reload|start)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Read .git/fake/notify.log, .git/ns/handoffs/2026-10-10.md and the transcript. Pass only if the supervisor pinged that main went red with #100 as its fix, pinged that ns watch stopped the night because fix unit #100 ended stuck with main still red, did not stop or restart the night itself, and the report's How it ended names main_red_unfixed (or says the fix issue ended unfixed) and ranks red main near the top of Needs you."
required = false
