description = "One unit stuck between two merges while the operator is away: a single stuck unit is a ping, never a stop. The merges wait for the report."
fixture = "night-log"
skills = ["ns-supervise"]
extra_skills = ["ns-writing-for-humans"]
timeout_minutes = 15
prompt = """
Supervise tonight's ns watch. I'm away until morning, so act on your own.

This night is a rehearsal on a recorded run log, so nothing new will arrive: handle every event logged so far, do one slow check, act on what they show, bring the report up to date, then end your turn instead of waiting for more events.
"""

[setup]
commands = [
  "mkdir -p .git/ns .git/fake/units .git/fake/active",
  "cp ../runs.jsonl .git/ns/runs.jsonl",
  "touch .git/fake/units/ns-watch.service",
  "echo 'Sat 2026-10-10 12:00:00 UTC' > .git/fake/active/ns-watch.service",
]

[[check]]
type = "command"
run = "! grep -Eq '^systemctl .*(stop|kill) ' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "command"
run = "grep -Eq '#42|42-fix-widget-sort' .git/fake/notify.log"
expect_exit = 0

[[check]]
type = "command"
run = "! grep -Eq '#41|#43|41-feat|43-feat' .git/fake/notify.log"
expect_exit = 0

[[check]]
type = "file_exists"
path = ".git/ns/handoffs/2026-10-10.md"

# Read-only apart from starting and stopping: no merge, relabel, comment, edit or restart.
[[check]]
type = "command"
run = "! grep -Eq '^gh .*(pr merge|pr review|pr comment|pr edit|issue edit|issue close|issue comment)|^systemctl .*(restart|reload)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Read .git/fake/notify.log and .git/ns/handoffs/2026-10-10.md. Pass only if the pings cover the stuck unit 42 and no ping is about the merges of 41 or 43, and the report lists 41 and 43 as merged and 42 as stuck with a diagnosis or reason."
required = false
