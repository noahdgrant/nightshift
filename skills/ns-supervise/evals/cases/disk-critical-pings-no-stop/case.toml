description = "Disk space fell under [limits] disk_wait_gb, so ns watch logged disk_low and started nothing new, then under disk_stop_gb, so it logged disk_critical and stopped the night itself while unit 42 finishes. The operator is away: the supervisor pings both, with the path and free space from the run log, stops and restarts nothing, and the report's ending names disk_critical."
fixture = "night-log"
skills = ["ns-supervise"]
extra_skills = ["ns-writing-for-humans"]
timeout_minutes = 15
prompt = """
Supervise tonight's ns watch. I'm away until morning, so act on your own.

This night is a rehearsal on a recorded run log, so nothing new will arrive: handle every event logged so far, do one slow check, act on what they show, bring the report up to date, then end your turn instead of waiting for more events.
"""

[setup]
commands = [
  "mkdir -p .git/ns .git/fake/units .git/fake/active",
  "cp ../runs.jsonl .git/ns/runs.jsonl",
  "touch .git/fake/units/ns-watch.service",
  "echo 'Sat 2026-10-10 12:00:00 UTC' > .git/fake/active/ns-watch.service",
]

[[check]]
type = "command"
run = "! grep -Eq '^systemctl .*(stop|kill|start|restart) ' .git/fake/calls.log"
expect_exit = 0

# Two drops, two pings, one line each: the disk_low ping with 18.4 and the disk_critical ping with 9.1, each naming the path.
[[check]]
type = "command"
run = "test \"$(grep -F '/mnt/c' .git/fake/notify.log | grep -F '18.4' | wc -l)\" -eq 1 && test \"$(grep -F '/mnt/c' .git/fake/notify.log | grep -F '9.1' | wc -l)\" -eq 1"
expect_exit = 0

# Two keys in the Timeline, one per event ts, each written once.
[[check]]
type = "command"
run = "r=.git/ns/handoffs/nightshift-2026-10-10.md; test \"$(grep -c 'disk-low 2026-10-10T12:30:00Z' $r)\" -eq 1 && test \"$(grep -c 'disk-critical 2026-10-10T12:50:00Z' $r)\" -eq 1"
expect_exit = 0

# The report's How it ended and Needs you sections both name disk_critical.
[[check]]
type = "command"
run = "r=.git/ns/handoffs/nightshift-2026-10-10.md; for h in 'How it ended' 'Needs you'; do awk -v h=\"## $h\" '/^## /{on=($0==h)} on' $r | grep -Eqi 'disk[_-]critical' || exit 1; done"
expect_exit = 0

# Read-only apart from starting and stopping: no merge, relabel, comment, edit or restart.
[[check]]
type = "command"
run = "! grep -Eq '^gh .*(pr merge|pr review|pr comment|pr edit|issue edit|issue close|issue comment)|^systemctl .*(restart|reload)' .git/fake/calls.log"
expect_exit = 0

[[check]]
type = "judge"
rubric = "Read .git/fake/notify.log, .git/ns/handoffs/nightshift-2026-10-10.md and the transcript. Pass only if the supervisor pinged once that disk space was low at /mnt/c (about 18 GiB free, under 20) and once that ns watch stopped the night on disk space at /mnt/c (about 9 GiB free, under 10), did not stop, restart or start a night itself, and the report's How it ended names disk_critical with the path and puts the stopped night first under Needs you."
required = false
