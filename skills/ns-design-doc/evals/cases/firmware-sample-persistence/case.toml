description = "An approved requirements doc asks the zephyr-logger ring buffer to keep samples across a reset for 10 years. Writing every sample to the 64 KB storage partition would wear it out roughly 60 times over (10 samples per second for 10 years, 12 bytes each, against 16 sectors rated for 10,000 erases), a calculation the requirements doc does not ask for and only the firmware checklist's endurance prompt triggers. Under gates: auto the skill should write the design doc, put a power cut in the failure modes at the flash write, state the RAM and flash cost, do the endurance arithmetic against SAMPLELOG-2, and raise the shortfall as an open question rather than paper over it, and note that `timestamp_ms` restarts at zero across a reset."
fixture = "zephyr-logger"
skills = ["ns-design-doc"]
extra_skills = ["ns-contract", "ns-domain-modeling"]
requires = ["zephyr"]
timeout_minutes = 20
prompt = """
Write the design doc for docs/requirements/samplelog/v1.md. No one is around to answer questions. gates: auto
"""

[[check]]
type = "command"
run = '[ "$(ls docs/design/*/v1.md 2>/dev/null | wc -l)" -eq 1 ]'
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && g=$(awk '/^#+ /{n=match($0,/^#+/)?RLENGTH:0; if(o&&n<=l)o=0; if(!o&&tolower($0) ~ /^#+ +([0-9]+(\.[0-9]+)*\.? +)?goals/){o=1;l=n;next}} o' "$f") && for id in SAMPLELOG-1 SAMPLELOG-2 SAMPLELOG-3; do printf '%s\n' "$g" | grep -Eq "$id([^0-9]|$)" || exit 1; done'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && awk '/^#+ /{n=match($0,/^#+/)?RLENGTH:0; if(o&&n<=l)o=0; if(!o&&tolower($0) ~ /^#+ +([0-9]+(\.[0-9]+)*\.? +)?failure/){o=1;l=n;next}} o' "$f" | grep -Ei '(power|reset|brown)' | grep -Eiq '(write|erase|flash)' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && grep -Eiq '(endurance|wear|erase cycles)' "$f" && grep -Ewq 'RAM' "$f"'''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && awk '/^#+ /{n=match($0,/^#+/)?RLENGTH:0; if(o&&n<=l)o=0; if(!o&&tolower($0) ~ /^#+ +([0-9]+(\.[0-9]+)*\.? +)?open questions/){o=1;l=n;next}} o' "$f" | grep -E '^\|' | grep -Ei '(endurance|wear|erase)' | grep -Eiq '(short|exceed|cannot|not last|insufficient|too (many|few)|fewer|[0-9]+ ?(x|times))' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && grep -i 'timestamp' "$f" | grep -Eiq '(reset|reboot|restart|zero|uptime|monoton)' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && s=$(grep -Ei '^\| *\**Status' "$f" | head -1 | tr -d '*') && printf '%s' "$s" | grep -Eiq '^\| *Status *\| *(Draft|In review)' '''
expect_exit = 0

[[check]]
type = "command"
run = '''f=$(ls docs/design/*/v1.md) && ! grep -Eq '^>' "$f" && ! grep -Eqw 'N/A' "$f"'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = ["docs/design/**", "docs/adr/**", "GLOSSARY.md", ".ns/**"]

[[check]]
type = "judge"
rubric = "Read the design doc under docs/design/. Pass only if it covers the firmware prompts this change touches: the flash and RAM cost of the design with a source for each number; a walk of the persist sequence with a power cut at each step, saying what the buffer holds after each; the flash endurance arithmetic for SAMPLELOG-2 against the 64 KB partition at 10,000 erase cycles, with the conclusion that writing every sample cannot last 10 years and the shortfall raised as an Open questions row with an owner rather than silently dropped or invented away; how flash writes stay out of the ISR path that SAMPLELOG-3 protects; and what `timestamp_ms` (uptime, which restarts at zero) means for ordering samples across a reset, given SAMPLELOG-1. Fail a doc that lists checklist prompts the change does not touch, such as cellular data cost or LwM2M object IDs."
required = false
