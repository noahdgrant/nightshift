# Checks validated by hand against an expected review.md (every check passes) and wrong ones (the finding raised only by readability, a heading naming no union or optional fields, cycles 1: each fails a check).
description = "First review pass on a TypeScript file that models a reservation's three exclusive states (held, fulfilled, cancelled) as a bag of optional fields, so a reservation both fulfilled and cancelled compiles. Told to run the panel once with no fix cycles, review.md must hold a finding from the architecture axis that names the optional-field bag or a discriminated union."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 7-reservation-view, on branch ns/7-reservation-view in this repo. The brief is .ns/7-reservation-view/brief.md. Run the review panel once and write review.md: run no fix cycles and change no code. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/7-reservation-view",
  "mkdir -p .ns/7-reservation-view && cp ../brief.md .ns/7-reservation-view/",
  "git apply ../reservation-view.patch",
  "git add web && git commit -q -m 'feat(web): add the reservation view type'",
]

[[check]]
type = "frontmatter"
path = ".ns/7-reservation-view/review.md"
key = "cycles"
equals = "0"

[[check]]
# A finding whose heading names the optional-field bag or the union that replaces it, raised on the architecture axis.
type = "regex"
path = ".ns/7-reservation-view/review.md"
pattern = '(?im)^###\s+\**[CIS]\d+\.[^\n]*(union|discriminat|optional|illegal|impossible|contradict|bag|exclusive|mutually)[^\n]*(?:\n(?:[^#\n][^\n]*)?)*?\n-\s*\**Axis:\**[^\n]*\barchitecture\b'

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**"]

[[check]]
type = "judge"
rubric = "Did the review find that ReservationView spreads three exclusive states over optional fields, so contradictory combinations (fulfilled and cancelled, cancelled with no reason) compile, propose a discriminated union on a state field, raise it on the architecture axis, and leave the code unfixed as told?"
required = false
