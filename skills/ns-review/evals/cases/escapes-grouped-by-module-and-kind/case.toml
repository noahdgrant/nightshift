description = "A clean diff that caps reserve's ttl sits beside three pre-existing bugs in src/inventory/warehouse.py: seeded defects (a) `quantity >= available` and (b) stock_levels counting expired holds, plus a zero ttl the base commit lets through (`ttl < timedelta(0)`). Seeded defect (d), the two-part SKU pattern, sits in src/inventory/models.py, which already has an open bug issue of escapes in .scratch/inventory-bugs/. review.md must pass, the warehouse.py escapes must go to one new issue with one checklist item each, and the models.py escape must be appended to the open issue and commented on, with no new issue for models.py."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 01-cap-reservation-ttl, on branch ns/01-cap-reservation-ttl in this repo. The brief is .ns/01-cap-reservation-ttl/brief.md, and its issue is .scratch/reservations/issues/01-cap-reservation-ttl.md in the repo's local tracker. gates: auto. Nobody is around to answer questions. Stop once review.md is written: skip verify for this run, don't push, don't ship.
"""

[setup]
commands = [
  "sed -i 's/if ttl <= timedelta(0):/if ttl < timedelta(0):/' src/inventory/warehouse.py",
  "git add src .scratch && git commit -q -m 'refactor(warehouse): simplify the ttl check'",
  "git checkout -q -b ns/01-cap-reservation-ttl",
  "mkdir -p .ns/01-cap-reservation-ttl && cp ../brief.md .ns/01-cap-reservation-ttl/",
  "git apply ../max-ttl.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): cap reservation ttl at one day'",
]

[[check]]
type = "frontmatter"
path = ".ns/01-cap-reservation-ttl/review.md"
key = "status"
equals = "pass"

[[check]]
# The warehouse.py escapes (two or more of the three seeded) share one new issue, with one checklist item each, and it opens with the disclosure line, carries the escape marker and takes the highest priority among them.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, re, sys
text = open(".ns/01-cap-reservation-ttl/review.md", encoding="utf-8").read()
blocks = re.split(r"(?m)^(?=### [CIS]\d+\.)", text)[1:]
field = lambda k, b: (re.search(r"(?mi)^-\s*\**" + k + r":\**\s*(.*)$", b) or [None, ""])[1]
escapes = [b for b in blocks
           if re.match(r"(?i)`?pre-existing", field("Scope", b))
           and not re.match(r"(?i)dismissed", field("Status", b))]
ware = [b for b in escapes if "warehouse.py" in field("Location", b)]
if len(ware) < 2:
    sys.exit("want two or more warehouse.py escapes, got %d" % len(ware))
targets = {re.sub(r"\W", "", field("Status", b).lower().replace("deferred", "")) for b in ware}
if not all(re.match(r"(?i)deferred:", field("Status", b)) for b in ware) or len(targets) != 1:
    sys.exit("warehouse.py escapes are not all deferred to one issue: %s" % [field("Status", b) for b in ware])
skip = ("01-cap-reservation-ttl.md", "01-bugs-in-models.md")
new = [p for p in glob.glob(".scratch/**/*.md", recursive=True) if not p.endswith(skip)]
hits = []
for p in new:
    t = open(p, encoding="utf-8").read()
    items = re.findall(r"(?m)^\s*- \[[ xX]\] .*", t)
    if not any("warehouse.py" in i for i in items):
        continue
    hits.append(p)
    checks = {
        "one item per escape": len(items) == len(ware),
        "every item in warehouse.py": all("warehouse.py" in i for i in items),
        "disclosed": t.lstrip().startswith("🤖 *Posted by nightshift, an AI agent.*"),
        "escaped": re.search(r"(?i)escaped an earlier review", t),
        "source": re.search(r"(?m)^Source: review_escape\s*$", t),
        "needs-triage": re.search(r"(?mi)^\**Status:\**\s*`?needs-triage", t),
        "bug": re.search(r"(?mi)^\**Category:\**\s*`?bug", t),
        "priority": re.search(r"(?mi)^\**Priority:\**\s*`?(priority:)?(high|critical)\b", t),
    }
    print(p, len(ware), "escapes", {k: bool(v) for k, v in checks.items()})
    if not all(checks.values()):
        sys.exit("the warehouse.py issue misses a check")
if len(hits) != 1:
    sys.exit("want one new issue for the warehouse.py escapes, got %s" % hits)
PYEOF
'''
expect_exit = 0

[[check]]
# The models.py escape went to the open issue for that module and kind: its items appended to the body, and a disclosed comment with them. No new issue names models.py.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, re, sys
text = open(".ns/01-cap-reservation-ttl/review.md", encoding="utf-8").read()
blocks = re.split(r"(?m)^(?=### [CIS]\d+\.)", text)[1:]
field = lambda k, b: (re.search(r"(?mi)^-\s*\**" + k + r":\**\s*(.*)$", b) or [None, ""])[1]
models = [b for b in blocks
          if re.match(r"(?i)`?pre-existing", field("Scope", b))
          and "models.py" in field("Location", b)
          and not re.match(r"(?i)dismissed", field("Status", b))]
if not models or not all(re.match(r"(?i)deferred:", field("Status", b)) for b in models):
    sys.exit("want a models.py escape, deferred: %s" % [field("Status", b) for b in models])
t = open(".scratch/inventory-bugs/issues/01-bugs-in-models.md", encoding="utf-8").read()
body, _, comments = t.partition("## Comments")
items = re.findall(r"(?m)^\s*- \[[ xX]\] .*", body)
if len(items) < 1 + len(models):
    sys.exit("the open issue's body has %d items, want %d" % (len(items), 1 + len(models)))
if "🤖 *Posted by nightshift, an AI agent.*" not in comments:
    sys.exit("no disclosed comment on the open issue")
if not re.search(r"(?m)^\s*- \[[ xX]\] .*models\.py", comments):
    sys.exit("the comment has no checklist item in models.py")
skip = ("01-cap-reservation-ttl.md", "01-bugs-in-models.md")
for p in glob.glob(".scratch/**/*.md", recursive=True):
    if not p.endswith(skip) and re.search(r"(?m)^\s*- \[[ xX]\] .*models\.py", open(p, encoding="utf-8").read()):
        sys.exit("%s files a models.py escape anew" % p)
print("ok:", len(models), "models.py escapes added to the open issue")
PYEOF
'''
expect_exit = 0

[[check]]
# The escapes went to the tracker, not the fix loop.
type = "regex"
path = "src/inventory/warehouse.py"
pattern = "if quantity >= available:"

[[check]]
type = "judge"
rubric = "Did the review file the pre-existing bugs in src/inventory/warehouse.py as one new issue with a checklist item per finding, add the pre-existing SKU-pattern bug in src/inventory/models.py to the open issue for that module (body and a comment) rather than filing a new one, and still pass the unit?"
required = false
