# Checks validated by hand against an expected review.md (every check passes) and wrong ones (the mutation recorded killed, the missing test filed only as a Suggestion, a survived row for another mutation: each fails a check).
description = "First review pass on Warehouse.low_stock, whose one test checks an empty item and a full one but never an item at exactly the threshold, so `<=` to `<` survives. Told to run the panel once with no fix cycles, review.md must hold an Important in changed code naming the missing test, and its Mutation check table must record the boundary mutation as survived."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 5-low-stock, on branch ns/5-low-stock in this repo. The brief is .ns/5-low-stock/brief.md. Run the review panel once and write review.md: run no fix cycles and change no code. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/5-low-stock",
  "mkdir -p .ns/5-low-stock && cp ../brief.md .ns/5-low-stock/",
  "git apply ../low-stock.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add low_stock'",
]

[[check]]
type = "frontmatter"
path = ".ns/5-low-stock/review.md"
key = "cycles"
equals = "0"

[[check]]
# An open Important in changed code leaves the review short of pass.
type = "regex"
path = ".ns/5-low-stock/review.md"
pattern = '(?m)^status:\s*(fail|blocked)\b'

[[check]]
# An Important whose heading names the untested threshold boundary, scoped to changed code.
type = "regex"
path = ".ns/5-low-stock/review.md"
pattern = '(?im)^###\s+\**I\d+\.[^\n]*(threshold|boundary|exactly|edge|<=|at most|surviv|missing test|untested|no test|not tested)[^\n]*(?:\n(?:[^#\n][^\n]*)?)*?\n-\s*\**Scope:\**\s*`?changed\b'

[[check]]
# The Mutation check table records the boundary mutation as survived.
type = "regex"
path = ".ns/5-low-stock/review.md"
pattern = '(?im)^\|[^\n]*(<=|threshold)[^\n]*\|\s*`?survived\b[^|\n]*\|?\s*$'

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**"]

[[check]]
type = "judge"
rubric = "Did the review run a mutation on low_stock's `<=` boundary against only the warehouse tests, record it as survived, and raise an Important naming the missing test for an item at exactly the threshold?"
required = false
