# Checks validated by hand against an expected run (a test for the unknown SKU, cycle-4.md of kind fix-only, review.md pass with I3 fixed in cycle 4: every check passes) and wrong ones (blocked at cycle 3 with no fix; pass claimed with no test added: each fails a check).
description = "Full fix cycles 1 to 3 have run and I3 (no test that cancel_all raises UnknownItem) was first raised in cycle 3, so no fix cycle has tried it. The loop must run fix-only cycle 4, which fixes I3, and review.md must pass with cycles 4, I3 fixed in cycle 4, and a cycle-4.md of kind fix-only."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 40
prompt = """
Review unit 2-cancel-all, on branch ns/2-cancel-all in this repo. The brief is .ns/2-cancel-all/brief.md. The fix loop has run full cycles 1 to 3, and cycle 3's review pass is done; their records are .ns/2-cancel-all/review/cycle-1.md to cycle-3.md. Continue the review from there: run whatever fix cycles the skill still calls for, then write review.md. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/2-cancel-all",
  "mkdir -p .ns/2-cancel-all/review && cp ../brief.md .ns/2-cancel-all/",
  "for n in 1 2 3; do cp ../cycle-$n.md .ns/2-cancel-all/review/; done",
  "git apply ../cancel-all.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add cancel_all'",
]

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "status"
equals = "pass"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cycles"
equals = "4"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review/cycle-4.md"
key = "kind"
equals = "fix-only"

[[check]]
type = "regex"
path = ".ns/2-cancel-all/review.md"
pattern = '(?m)^### I3\.[^#]*?^- Status: fixed \(cycle 4'

[[check]]
# I3 is fixed: deleting the unknown-SKU check in cancel_all now fails a test.
type = "command"
run = '''
b=$(mktemp)
cp src/inventory/warehouse.py "$b"
python3 - <<'PY'
import pathlib
p = pathlib.Path("src/inventory/warehouse.py")
s = p.read_text()
m = s.replace("returning how many were dropped.\"\"\"\n        self.item(sku)\n", "returning how many were dropped.\"\"\"\n", 1)
assert m != s, "cancel_all no longer starts with self.item(sku)"
p.write_text(m)
PY
python3 -m pytest -q -p no:cacheprovider; s=$?
cp "$b" src/inventory/warehouse.py && rm -f "$b"
[ "$s" -ne 0 ]
'''
expect_exit = 0

[[check]]
type = "command"
run = "python3 -m pytest -q -p no:cacheprovider"
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**", "tests/**"]

[[check]]
type = "judge"
rubric = "Did the review give I3, a finding first raised in cycle 3, a fix attempt in a fix-only cycle 4 instead of blocking on it, and pass once the fix landed?"
required = false
