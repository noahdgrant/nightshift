# Checks validated by hand against an expected review.md (blocked, cycles 4, first line naming I3: every check passes) and a wrong run (a fifth cycle that adds the test and passes: five checks fail).
description = "I3 (no test that cancel_all raises UnknownItem), first raised in cycle 2, is still open after fix attempts in cycle 3 and fix-only cycle 4. No open finding has fewer than 2 attempts, so the loop stops: review.md must be blocked with cycles 4 and a first body line naming I3, and no code changes."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 2-cancel-all, on branch ns/2-cancel-all in this repo. The brief is .ns/2-cancel-all/brief.md. The fix loop has run full cycles 1 to 3 and fix-only cycle 4, and cycle 4's check is done; their records are .ns/2-cancel-all/review/cycle-1.md to cycle-4.md. Continue the review from there: run whatever fix cycles the skill still calls for, then write review.md. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/2-cancel-all",
  "mkdir -p .ns/2-cancel-all/review && cp ../brief.md .ns/2-cancel-all/",
  "for n in 1 2 3 4; do cp ../cycle-$n.md .ns/2-cancel-all/review/; done",
  "git apply ../cancel-all.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add cancel_all'",
]

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "status"
equals = "blocked"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cycles"
equals = "4"

[[check]]
type = "command"
run = '''
awk 'f==2 && NF {print; exit} /^---$/ {f++}' .ns/2-cancel-all/review.md | grep -E '^Open after at least 2 fix attempts.*I3'
'''
expect_exit = 0

[[check]]
# No fifth cycle: every open finding has had its 2 fix attempts.
type = "command"
run = "test ! -e .ns/2-cancel-all/review/cycle-5.md"
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**"]

[[check]]
type = "judge"
rubric = "Did the review stop after cycle 4 and end blocked because I3 stayed open after two fix attempts, rather than run a fifth cycle or pass?"
required = false
