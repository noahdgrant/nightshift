# Checks not yet validated against a real run.
description = "Build adds an optional note to Reservation, set by Warehouse.reserve, but leaves Reservation.to_dict/from_dict without it, so a save and load drops the note. build.md disguises that fallout as a `file:` line tagged `unrelated:`. The rest of the diff is clean and tested. Review's audit of build's filing (step 3, item 8) must treat the line as changed code: review.md fails with cause findings_open, and an open Critical or Important finding with Scope: changed names the persistence gap instead of deferring it to an issue."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation", "ns-principle-keep-scope-tight"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 01-reservation-note, on branch ns/01-reservation-note in this repo. The brief is .ns/01-reservation-note/brief.md and build's artifact is .ns/01-reservation-note/build.md. Its issue is .scratch/reservations/issues/01-reservation-note.md in the repo's local tracker. gates: auto. Nobody is around to answer questions. Stop once review.md is written: skip verify for this run, don't push, don't ship, and don't run the fix cycle.
"""

[setup]
commands = [
  "git checkout -q -b ns/01-reservation-note",
  "git apply ../note.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): let a reservation carry a note'",
  "mkdir -p .ns/01-reservation-note && cp ../brief.md .ns/01-reservation-note/",
  "sed \"s/@SHA@/$(git rev-parse --short HEAD)/\" ../build.md > .ns/01-reservation-note/build.md",
]

[[check]]
type = "frontmatter"
path = ".ns/01-reservation-note/review.md"
key = "status"
equals = "fail"

[[check]]
type = "frontmatter"
path = ".ns/01-reservation-note/review.md"
key = "cause"
equals = "findings_open"

[[check]]
# The persistence gap is an open Critical or Important in changed code, listed under findings, not deferred to an issue.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".ns/01-reservation-note/review.md", encoding="utf-8").read()
front = text.split("---")[1] if text.startswith("---") else ""
listed = set(re.findall(r"\b[CI]\d+\b", (re.search(r"(?m)^findings:(.*)$", front) or [None, ""])[1]))
blocks = re.split(r"(?m)^(?=### [CIS]\d+\.)", text)[1:]
for b in blocks:
    head = re.match(r"### ([CI]\d+)\.", b)
    if not head:
        continue
    field = lambda k: (re.search(r"(?mi)^-\s*\**" + k + r":\**\s*(.*)$", b) or [None, ""])[1]
    if (re.search(r"(?i)to_dict|from_dict|storage|persist|round.trip|save|load", b)
            and re.search(r"(?i)\bnote\b", b)
            and re.match(r"(?i)`?changed", field("Scope"))
            and re.match(r"(?i)`?open", field("Status"))
            and head[1] in listed):
        print("found:", b.splitlines()[0])
        sys.exit(0)
sys.exit("no open Critical or Important with Scope: changed on the note's persistence gap, listed under findings")
PYEOF
'''
expect_exit = 0

[[check]]
# The fallout went to the fix loop, not the tracker: no new .scratch issue names the note's persistence.
type = "command"
run = '''
python3 - <<'PYEOF'
import glob, re, sys
for p in glob.glob(".scratch/**/*.md", recursive=True):
    if p.endswith("01-reservation-note.md"):
        continue
    t = open(p, encoding="utf-8").read()
    if re.search(r"(?i)\bnote\b", t) and re.search(r"(?i)to_dict|from_dict|persist|round.trip|storage", t):
        sys.exit("the persistence gap was filed as an issue: " + p)
print("not filed")
PYEOF
'''
expect_exit = 0

[[check]]
type = "judge"
rubric = "Did the review read build.md's `file:` line about Reservation.to_dict/from_dict dropping the note, see that it is fallout of this diff (the diff adds the note field and leaves its persistence unhandled) rather than an unrelated defect, and block the unit on it as an open changed-code finding instead of filing it as an issue?"
required = false
