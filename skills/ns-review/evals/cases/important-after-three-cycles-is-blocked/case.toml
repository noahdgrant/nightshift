description = "Full fix cycles 1 to 3 have each tried I1 (no test that cancel_all raises UnknownItem), and it is still open, on a line the unit added. With 3 fix attempts and nothing left under 2, no fix-only cycle is due: review.md must be blocked (cycles 3, `reason` `Open after at least 2 fix attempts` naming I1, `cause: findings_open`), not pass with I1 filed as an escape issue."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 2-cancel-all, on branch ns/2-cancel-all in this repo. The brief is .ns/2-cancel-all/brief.md. The fix loop has run full cycles 1 to 3, and cycle 3's review pass is done; their records are .ns/2-cancel-all/review/cycle-1.md to cycle-3.md. Continue the review from there: run whatever fix cycles the skill still calls for, then write review.md. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/2-cancel-all",
  "mkdir -p .ns/2-cancel-all/review && cp ../brief.md .ns/2-cancel-all/",
  "for n in 1 2 3; do cp ../cycle-$n.md .ns/2-cancel-all/review/; done",
  "git apply ../cancel-all.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add cancel_all'",
]

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "status"
equals = "blocked"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cause"
equals = "findings_open"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cycles"
equals = "3"

[[check]]
type = "command"
run = '''
awk '/^---$/ {n++; next} n==1' .ns/2-cancel-all/review.md | grep -E '^reason: *["'"'"']?Open after at least 2 fix attempts.*I1'
'''
expect_exit = 0

[[check]]
type = "regex"
path = ".ns/2-cancel-all/review.md"
pattern = "(?i)by hand"

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**"]

[[check]]
type = "judge"
rubric = "Did the review end blocked because I1, an Important finding on a line the unit added, stayed open after three fix attempts, with no fix-only cycle run, rather than passing with I1 filed as an escape issue? Does its reason name I1?"
required = false
