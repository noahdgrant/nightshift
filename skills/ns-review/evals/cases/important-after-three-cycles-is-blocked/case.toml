description = "The fix loop has run its 3 cycles and I1 (no test that cancel_all raises UnknownItem) is still open, on a line the unit added. review.md must be blocked by the cycle-limit rule (cycles 3, first body line `Open after 3 fix cycles` naming I1), not pass with I1 deferred to a follow-up issue."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 2-cancel-all, on branch ns/2-cancel-all in this repo. The brief is .ns/2-cancel-all/brief.md. The fix loop has already run all 3 cycles; their records are .ns/2-cancel-all/review/cycle-1.md to cycle-3.md. Run no more fix cycles and change no code: rerun the review panel on the current diff, then write review.md. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/2-cancel-all",
  "mkdir -p .ns/2-cancel-all/review && cp ../brief.md .ns/2-cancel-all/",
  "for n in 1 2 3; do cp ../cycle-$n.md .ns/2-cancel-all/review/; done",
  "git apply ../cancel-all.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add cancel_all'",
]

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "status"
equals = "blocked"

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cycles"
equals = "3"

[[check]]
type = "command"
run = '''
awk 'f==2 && NF {print; exit} /^---$/ {f++}' .ns/2-cancel-all/review.md | grep -E '^Open after 3 fix cycles.*I1'
'''
expect_exit = 0

[[check]]
type = "regex"
path = ".ns/2-cancel-all/review.md"
pattern = "(?i)by hand"

[[check]]
type = "diff_scope"
allow = [".ns/**"]

[[check]]
type = "judge"
rubric = "Did the review end blocked because I1, an Important finding on a line the unit added, stayed open after the third fix cycle, rather than passing with I1 deferred to a follow-up issue? Does its opening line name I1?"
required = false
