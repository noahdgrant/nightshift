# Checks validated by hand against an expected run (cycle-4.md and review.md hold only I3, fixed) and a wrong one (cycle 4 raises I4 for the debug print: two checks fail).
description = "As cycle-3-finding-fixed-in-fix-only-cycle, but cancel_all also carries a leftover debug print that no earlier pass raised. Fix-only cycle 4 checks only I3: cycle-4.md names no finding but I3, and review.md holds no finding first raised in cycle 4."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 40
prompt = """
Review unit 2-cancel-all, on branch ns/2-cancel-all in this repo. The brief is .ns/2-cancel-all/brief.md. The fix loop has run full cycles 1 to 3, and cycle 3's review pass is done; their records are .ns/2-cancel-all/review/cycle-1.md to cycle-3.md. Continue the review from there: run whatever fix cycles the skill still calls for, then write review.md. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
commands = [
  "git checkout -q -b ns/2-cancel-all",
  "mkdir -p .ns/2-cancel-all/review && cp ../brief.md .ns/2-cancel-all/",
  "for n in 1 2 3; do cp ../cycle-$n.md .ns/2-cancel-all/review/; done",
  "git apply ../cancel-all.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): add cancel_all'",
]

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review/cycle-4.md"
key = "kind"
equals = "fix-only"

[[check]]
# cycle-4.md lists only the finding handed to the fix.
type = "command"
run = '''
! grep -E '^#+ *\**[CI][0-9]+' .ns/2-cancel-all/review/cycle-4.md | grep -vE '^#+ *\**I3\b'
'''
expect_exit = 0

[[check]]
type = "regex"
path = ".ns/2-cancel-all/review.md"
pattern = '(?m)^- Cycle: *4\b'
present = false

[[check]]
type = "frontmatter"
path = ".ns/2-cancel-all/review.md"
key = "cycles"
equals = "4"

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**", "tests/**"]

[[check]]
type = "judge"
rubric = "In fix-only cycle 4, did the reviewers only check whether I3 was fixed, with no new finding raised in cycle 4 (the debug print in cancel_all included)?"
required = false
