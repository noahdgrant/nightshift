# Checks validated by hand against written outcomes: a review.md with a Critical or Important spec finding naming
# low_stock and status fail passes; one with no such finding, or with status pass, fails.
description = "A fix brief lists two instances of one defect (Warehouse.stock_levels and Warehouse.low_stock both count expired reservations) and covers both. The diff fixes only stock_levels, with a test, and adds no guard for the class. Told to run the panel once with no fix cycles, review.md must hold a Critical or Important spec finding that low_stock is left unfixed, and must not pass."
fixture = "py-inventory"
skills = ["ns-review"]
extra_skills = ["ns-swarm", "ns-contract", "ns-tdd", "ns-no-comments", "ns-principle-fix-root-causes", "ns-principle-test-behavior-not-implementation"]
requires = ["python"]
timeout_minutes = 30
prompt = """
Review unit 4-expired-holds, on branch ns/4-expired-holds in this repo. The brief is .ns/4-expired-holds/brief.md. Run the review panel once and write review.md: run no fix cycles and change no code. gates: auto. Nobody is around to answer questions. Skip verify, don't push, don't ship.
"""

[setup]
# low_stock lands on main first, so the unit's diff is the one-instance fix alone.
commands = [
  "git apply ../low-stock.patch",
  "git add src tests && git commit -q -m 'feat(warehouse): list items low on stock'",
  "git checkout -q -b ns/4-expired-holds",
  "mkdir -p .ns/4-expired-holds && cp ../brief.md .ns/4-expired-holds/",
  "git apply ../stock-levels-fix.patch",
  "git add src tests && git commit -q -m 'fix(warehouse): leave expired reservations out of stock levels'",
]

[[check]]
type = "frontmatter"
path = ".ns/4-expired-holds/review.md"
key = "cycles"
equals = "0"

[[check]]
type = "regex"
path = ".ns/4-expired-holds/review.md"
pattern = '(?m)^status:\s*(fail|blocked)\b'

[[check]]
# A Critical or Important finding that names the unfixed low_stock.
type = "command"
run = '''
python3 - <<'PYEOF'
import re, sys
text = open(".ns/4-expired-holds/review.md", encoding="utf-8").read()
sections = dict(re.findall(r"(?ms)^## (Critical|Important|Suggestion)\s*\n(.*?)(?=^## |\Z)", text))
blocking = sections.get("Critical", "") + sections.get("Important", "")
if "low_stock" not in blocking:
    sys.exit("no Critical or Important finding names low_stock")
print("low_stock flagged")
PYEOF
'''
expect_exit = 0

[[check]]
type = "diff_scope"
allow = [".ns/**", ".scratch/**"]

[[check]]
type = "judge"
rubric = "Did the review flag, at Critical or Important, that the diff fixes stock_levels but leaves low_stock, which the brief's Instances section covers, still counting expired reservations, quote the brief's Instances line, and leave the code unfixed as told?"
required = false
