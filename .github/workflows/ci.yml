name: CI

# PRs and main. Branch protection no longer requires PR branches to be up to
# date with main (parallel units kept rebasing), so a merge is not exactly what
# CI tested: two PRs that each pass alone can still break main together. The
# push run on main catches that.
on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels a superseded PR run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install the pinned tools cli/tests run (rules_pack*.rs run the rule packs; jq ships with the runner)
        id: tools
        working-directory: .
        run: scripts/ci-tools.sh install ruff ast-grep cargo-deny java pmd
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.tools.outputs.install-action }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: cargo test under a decoy GIT_DIR
        working-directory: .
        run: scripts/check-git-dir-decoy.sh

  skills-and-evals:
    name: Skills lint and eval dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Install the Rust rule pack's tools (rules/rust/check.sh; jq ships with the runner)
        id: tools
        run: scripts/ci-tools.sh install ast-grep cargo-deny
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.tools.outputs.install-action }}
      - name: Build ns
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Lint skills
        run: cli/target/debug/ns lint skills --human
      - name: Lint repo-local skills
        run: cli/target/debug/ns lint .agents/skills --human
      - name: Run verify-nightshift's Launch and Doctor recipes (fake claude and gh; jq ships with the runner)
        run: scripts/check-verify-recipes.sh
      - name: Check human-review markers
        run: cli/target/debug/ns check-markers --human
      - name: Rules check (new violations only, against .nightshift/rules-baseline.json)
        run: cli/target/debug/ns rules check --human
      - name: Ratchet check (measured values, against .nightshift/ratchets.json)
        run: cli/target/debug/ns ratchet check --human
      - name: Eval dry-run (validates every case and fixture, calls no model)
        run: |
          cfg="$RUNNER_TEMP/ns-config.toml"
          # The python capability is declared so py-* cases are planned, not
          # skipped. zephyr is left out: its cases skip in CI.
          printf '[eval]\nharness = "claude"\n\n[eval.capability.python]\n' > "$cfg"
          NS_CONFIG="$cfg" cli/target/debug/ns eval --dry-run > "$RUNNER_TEMP/plan.json"
          # claude is not on PATH here; the dry-run reports on_path: false and
          # exits 0. Fail on any skip other than the missing zephyr capability
          # (a missing fixture or skill also shows up as a skip).
          python3 - "$RUNNER_TEMP/plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          print("harness on_path:", plan["harness"]["on_path"])
          bad = [s for s in plan["skipped"]
                 if not s["reason"].startswith("missing capability: zephyr")]
          for s in bad:
              print(f"::error::{s['skill']}/{s.get('case', '')}: {s['reason']}")
          sys.exit(1 if bad else 0)
          PY

  fixtures:
    name: Fixture tests (py-inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals/fixtures/py-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (scripts/ci-tools.d)
        working-directory: .
        run: scripts/ci-tools.sh install pytest
      - run: pytest -q
      - name: ns-troubleshoot brief checker tests
        working-directory: skills/ns-troubleshoot/evals/cases
        run: |
          for test in */test_check_brief.py; do
            (cd "$(dirname "$test")" && python -m unittest -q test_check_brief)
          done

  rule-pack-list:
    name: List the rule packs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - name: Each rules/<pack>/ with a tests/run.sh, named by its NAME (scripts/rule-packs.sh)
        id: list
        run: |
          # Not piped, so a pack with no NAME fails the step: run steps have no pipefail.
          list=$(scripts/rule-packs.sh)
          packs=$(jq -Rcn '[inputs | split("\t") | {pack: .[0], name: .[1]}]' <<<"$list")
          echo "packs=$packs" >> "$GITHUB_OUTPUT"

  rule-packs:
    name: Rule pack tests (${{ matrix.name }})
    needs: rule-pack-list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rule-pack-list.outputs.packs) }}
    env:
      PACK: ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build ns
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Install the pinned tools in rules/<pack>/TOOLS (PMD's zip is cached for install.sh --offline)
        id: tools
        run: |
          read -ra tools < "rules/$PACK/TOOLS" || [ "${#tools[@]}" -gt 0 ]
          scripts/ci-tools.sh install "${tools[@]}"
      - if: steps.tools.outputs.install-action != ''
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.tools.outputs.install-action }}
      - name: rules/<pack>/tests/run.sh
        run: |
          "rules/$PACK/tests/run.sh"
      - name: rules/<pack>/tests/run.sh under a decoy GIT_DIR
        run: scripts/check-git-dir-decoy.sh "rules/$PACK/tests/run.sh"

  private-refs:
    name: Private-reference guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        env:
          PRIVATE_DENYLIST: ${{ vars.PRIVATE_DENYLIST }}
        run: scripts/check-private.sh
