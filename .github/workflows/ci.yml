name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # A release PR changes only versions and the changelog, and its code
      # was checked on main, so it needs only the lock to agree with the
      # manifest. The job still runs so the required check reports.
      - name: Check the lock agrees with the manifest
        if: github.head_ref == 'release-please--branches--main'
        run: cargo metadata --locked --format-version 1 --manifest-path cli/Cargo.toml > /dev/null
      - name: Run the checks
        if: github.head_ref != 'release-please--branches--main'
        run: scripts/ci-local.sh
