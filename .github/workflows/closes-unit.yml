name: PR closes a unit

# A change request must close the unit it answers (.nightshift/coding-standards.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# No run is ever cancelled: GitHub counts each cancelled run of a required check as
# a failure, so this file has no cancel setting. The check is stateless and takes seconds.

permissions:
  pull-requests: read
  issues: read

jobs:
  closes-unit:
    name: Closes a unit
    # release-please's release change request closes no unit, and it is the only
    # change request that does not: any other work gets a unit first. It is
    # known by its branch, which nobody names by accident and which a label,
    # one click away, would not be. A skipped job counts as passing, so it can
    # still merge.
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Closes a unit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # GitHub lists the units a PR closes only once the Closes line names a
        # unit that exists. It can lag a few seconds behind an edit, so retry.
        run: |
          for attempt in 1 2 3; do
            closes="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences \
              -q '[.closingIssuesReferences[] | "#\(.number)"] | join(" ")')"
            if [ -n "$closes" ]; then
              echo "PR closes $closes"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The PR body must end with 'Closes #<unit>', naming a unit that exists. See .nightshift/coding-standards.md."
          exit 1
