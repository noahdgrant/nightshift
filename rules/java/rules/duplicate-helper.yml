# One road per job: a static method named like a helper that already exists. The names are in
# utils/helper-name.yml. An instance method is not a duplicate; a static one is.
id: duplicate-helper
language: java
severity: warning
message: "`$NAME` duplicates a helper that already exists; call that one instead"
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-principle-pave-the-road/SKILL.md
ignores: []
rule:
  kind: method_declaration
  all:
    - has: {kind: modifiers, regex: '\bstatic\b'}
    - has: {field: name, pattern: $NAME, matches: helper-name}
