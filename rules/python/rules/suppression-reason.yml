# A lint or type suppression says why on the same line, as a second comment after it:
#   import os  # noqa: F401  # re-exported for callers
id: suppression-reason
language: python
severity: error
message: a suppression needs its reason on the same line, as a comment after it
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-contract/references/quality-bar.md
rule:
  kind: comment
  regex: '(?i)#\s*(?:noqa|type:\s*ignore|pyright:\s*ignore|pylint:\s*disable|ruff:\s*noqa)'
  not:
    regex: '(?i)#\s*(?:noqa|type:\s*ignore|pyright:\s*ignore|pylint:\s*disable|ruff:\s*noqa)[^#]*#\s*\S'
