# One road per job: a function or class named like a helper that already exists. The names
# are in utils/helper-name.yml. A method is not a duplicate; only a function outside a
# class body, or nested in a method, is.
id: duplicate-helper
language: python
severity: error
message: "`$NAME` duplicates a helper that already exists; call that one instead"
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-principle-pave-the-road/SKILL.md
ignores: []
rule:
  any:
    - kind: function_definition
      not:
        inside:
          kind: class_definition
          stopBy:
            kind: function_definition
    - kind: class_definition
  has:
    field: name
    pattern: $NAME
    matches: helper-name
