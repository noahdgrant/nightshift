# One road per job: an import comes from the standard library, the repo's own packages, or
# a dependency the repo allows (utils/allowed-package.yml).
id: dependency-allowlist
language: python
severity: error
message: "`$MOD` is outside the dependency allowlist; use what the repo already has, or have a human add it to the allowlist"
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-principle-pave-the-road/SKILL.md
rule:
  pattern: $MOD
  kind: dotted_name
  any:
    - inside: {kind: import_statement}
    - inside: {kind: aliased_import, field: name, inside: {kind: import_statement}}
    - inside: {kind: import_from_statement, field: module_name}
  not:
    any:
      - matches: stdlib-module
      - regex: '^_'
      - matches: allowed-package
