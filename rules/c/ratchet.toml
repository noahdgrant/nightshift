# The flash and RAM ratchets (docs/factory/run.md, "Ratchets"): ns-setup adds these tables to
# .nightshift/nightshift.toml, with {build} the command that builds the image and {elf} the
# image it writes, such as `west build -b native_sim app -d build/ratchet` and
# `build/ratchet/zephyr/zephyr.elf`. A cross build sets SIZE, as in
# `SIZE=arm-zephyr-eabi-size .nightshift/rules/c/ratchet-memory.sh flash {elf}`.
[ratchets.flash]
command = "{build} >&2 && .nightshift/rules/c/ratchet-memory.sh flash {elf}"
better = "lower"
tolerance = "0.5%"

[ratchets.ram]
command = "{build} >&2 && .nightshift/rules/c/ratchet-memory.sh ram {elf}"
better = "lower"
tolerance = "0.5%"
