# The clang-tidy half of the C pack (rules/c/README.md). Each group enforces a quality-bar axis
# (skills/ns-contract/references/quality-bar.md): bugprone and cert enforce Correctness,
# readability enforces Readability, and clang-diagnostic carries -Wall -Wextra.
Checks: >
  -*,
  bugprone-*,
  cert-*,
  readability-*,
  clang-diagnostic-*,
  -bugprone-easily-swappable-parameters,
  -readability-magic-numbers,
  -readability-identifier-length
HeaderFilterRegex: '.*'
WarningsAsErrors: ''
