id: suppression-without-reason
language: rust
severity: error
message: "#[allow] or #[expect] with no reason = \"...\": give the reason on the same line, or fix what it hides (quality bar, Comments: skills/ns-contract/references/quality-bar.md)"
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: '\b(allow|expect)\s*\('
  not:
    regex: '\breason\s*='
---
id: file-too-long
language: rust
severity: error
message: "file is past 1000 lines; split it along a seam (quality bar, Size: skills/ns-contract/references/quality-bar.md)"
rule:
  kind: source_file
  regex: '^(?:[^\n]*\n){1000}[\s\S]'
---
# A Kind::Harness built outside these files skips the billing and phase setup crate::harness::command
# adds (#657, #716); cli/clippy.toml bans Proc::harness, the other way in. Patterns that match one
# are not struct_expression nodes, so a match arm is never flagged.
id: harness-kind-construction
language: rust
severity: error
message: "a Kind::Harness built here skips the billing and phase setup of its kind; start the harness through crate::harness::command (#657)"
ignores: ["cli/src/harness.rs", "cli/src/proc.rs", "cli/src/proc/tests.rs"]
rule:
  kind: struct_expression
  has: {field: name, regex: '(^|::)Kind::Harness$'}
---
# The cleanups that delete a tree ns owns go through crate::tree::remove, which first makes every
# directory in it writable, so a read-only directory a phase left there cannot keep it (#730).
# Test code in these files may remove a tree it made itself.
id: tree-removal-skips-modes
language: rust
severity: error
message: "remove_dir_all here fails on a read-only directory a phase left; remove the tree through crate::tree::remove (#730)"
files: ["cli/src/clean.rs", "cli/src/build_output.rs", "cli/src/run/phase_run.rs"]
rule:
  kind: call_expression
  has: {field: function, regex: '(^|::)remove_dir_all$'}
  not:
    inside:
      stopBy: end
      all:
        - any: [{kind: function_item}, {kind: mod_item}]
        - follows:
            kind: attribute_item
            regex: '^#\[(test|cfg\(test\))\]$'
            stopBy: {not: {any: [{kind: attribute_item}, {kind: line_comment}, {kind: block_comment}]}}
---
# wall-clock-in-test, part 1 of 2: in a tests/ directory or a file named tests.rs, any code. Part 2 below matches the same
# code inside #[test] and #[cfg(test)] items anywhere.
id: wall-clock-in-test
language: rust
severity: error
message: "a test sleeps, times itself, or sets a literal timeout; wait for an event or use the fake clock instead (CODING_STANDARDS.md, \"A test never waits on the clock\")"
files: ["**/tests/**/*.rs", "**/tests.rs"]
rule:
  any:
    - kind: call_expression
      has: {field: function, regex: '(^|::)sleep$'}
    - kind: call_expression
      all:
        - has: {field: function, regex: '(^|::)Duration::from_[a-z0-9_]+$'}
        - has: {field: arguments, regex: '^\(\s*[0-9][0-9_.]*\s*\)$'}
    - kind: binary_expression
      all:
        - has: {field: operator, regex: '^[<>]=?$'}
        - has: {kind: call_expression, has: {field: function, regex: '(^|::)Instant::now$|\.elapsed$'}, stopBy: end}
    - kind: token_tree
      all:
        - has: {regex: '^[<>]=?$'}
        - has:
            kind: identifier
            any:
              - regex: '^elapsed$'
              - {regex: '^now$', follows: {regex: '^::$', follows: {regex: '^Instant$'}}}
---
# wall-clock-in-test, part 2 of 2: inside a #[test] or #[cfg(test)] item (a test fn or a tests
# module). check.sh drops a finding both parts report.
id: wall-clock-in-test
language: rust
severity: error
message: "a test sleeps, times itself, or sets a literal timeout; wait for an event or use the fake clock instead (CODING_STANDARDS.md, \"A test never waits on the clock\")"
rule:
  any:
    - kind: call_expression
      has: {field: function, regex: '(^|::)sleep$'}
    - kind: call_expression
      all:
        - has: {field: function, regex: '(^|::)Duration::from_[a-z0-9_]+$'}
        - has: {field: arguments, regex: '^\(\s*[0-9][0-9_.]*\s*\)$'}
    - kind: binary_expression
      all:
        - has: {field: operator, regex: '^[<>]=?$'}
        - has: {kind: call_expression, has: {field: function, regex: '(^|::)Instant::now$|\.elapsed$'}, stopBy: end}
    - kind: token_tree
      all:
        - has: {regex: '^[<>]=?$'}
        - has:
            kind: identifier
            any:
              - regex: '^elapsed$'
              - {regex: '^now$', follows: {regex: '^::$', follows: {regex: '^Instant$'}}}
  inside:
    stopBy: end
    all:
      - any: [{kind: function_item}, {kind: mod_item}]
      - follows:
          kind: attribute_item
          regex: '^#\[(test|cfg\(test\)|[\w:]+::test(\(.*\))?)\]$'
          stopBy: {not: {any: [{kind: attribute_item}, {kind: line_comment}, {kind: block_comment}]}}
