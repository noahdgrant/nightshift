# One road per job: an import comes from Node's built-in modules, a relative path, or a
# package the repo allows (utils/allowed-package.yml).
id: dependency-allowlist
language: tsx
severity: error
message: "`$MOD` is outside the dependency allowlist; use what the repo already has, or have a human add it to the allowlist"
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-principle-pave-the-road/SKILL.md
rule:
  pattern: $MOD
  kind: string_fragment
  inside:
    kind: string
    any:
      - inside: {kind: import_statement, field: source}
      - inside: {kind: export_statement, field: source}
      - inside:
          kind: arguments
          inside:
            kind: call_expression
            has: {field: function, regex: '^(?:require|import)$'}
  not:
    any:
      - regex: '^[./]'
      - matches: node-builtin
      - matches: allowed-package
