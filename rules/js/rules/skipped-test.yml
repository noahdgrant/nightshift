# Nothing is left behind: a `.skip` hides a test, and a `.only` hides every other one.
id: skipped-test
language: tsx
severity: error
message: a `.skip`, `.only`, `xit`, `xdescribe`, `fit` or `fdescribe` left in a test turns other tests off; remove it
url: https://github.com/noahdgrant/nightshift/blob/main/skills/ns-contract/references/quality-bar.md
rule:
  any:
    - kind: member_expression
      regex: '^(?:describe|context|suite|it|test|bench)(?:\s*\.\s*\w+)*\s*\.\s*(?:skip|only)$'
      not:
        inside:
          kind: call_expression
          field: function
          stopBy: neighbor
          has:
            field: arguments
            all:
              - has:
                  nthChild: 1
                  not:
                    any:
                      - kind: string
                      - kind: template_string
              - not:
                  has:
                    any:
                      - kind: arrow_function
                      - kind: function_expression
    - kind: call_expression
      has:
        field: function
        kind: identifier
        regex: '^(?:xit|xdescribe|fit|fdescribe)$'
      all:
        - has:
            field: arguments
            has:
              nthChild: 1
              any:
                - kind: string
                - kind: template_string
